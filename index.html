<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Sprite – Endless Run</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Lobster+Two:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#ffd77a;--ink:#070a24}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;font-family:Cinzel,Georgia,serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;background:radial-gradient(ellipse at center,rgba(5,6,30,.5),rgba(5,6,30,.12));pointer-events:none}
.panel>*{pointer-events:auto}
.hide{display:none!important}
h1,h2{font-family:'Lobster Two',cursive;font-style:italic;font-weight:700;color:var(--gold);text-shadow:0 0 24px #ffb83a99,0 0 60px #4fd6ff66;margin:0;line-height:.95}
h1{font-size:clamp(52px,12vw,110px)}h2{font-size:clamp(40px,8vw,80px)}
.sub{margin:0;font-size:clamp(13px,2.2vw,17px);color:#cfe9ff;letter-spacing:.04em}
.stat{font-family:Cinzel,serif;font-size:clamp(14px,2.2vw,20px);color:#fff3b0;margin:2px 0}
button{font:600 19px Cinzel,serif;color:var(--gold);background:rgba(10,14,50,.72);border:2px solid var(--gold);border-radius:999px;padding:9px 38px;cursor:pointer;box-shadow:0 0 22px #ffb83a66,inset 0 0 14px #ffb83a33}
button:hover,button:focus-visible{background:rgba(40,36,90,.88);outline:none;box-shadow:0 0 34px #ffb83acc}
.tips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:580px}
.tip{background:rgba(10,12,40,.68);border:1px solid rgba(255,215,122,.3);border-radius:10px;padding:6px 13px;font-size:12px;color:#dbe8ff}
.tip b{display:block;font-size:13px;margin-bottom:1px}
#sb{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));font-size:13px;padding:7px 16px;border-color:#b9a6ff;color:#d9ceff;box-shadow:0 0 14px #8a6bff44}
#pubar{position:fixed;left:max(14px,env(safe-area-inset-left));top:92px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.putag{display:flex;align-items:center;gap:6px;background:rgba(5,7,34,.82);border-radius:8px;padding:4px 10px;font-size:10.5px;font-family:Cinzel,serif;border:1px solid rgba(255,255,255,.12)}
.pu-track{width:50px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin-left:4px}
.pu-fill{height:100%;border-radius:2px;transition:width .08s linear}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- MENU -->
<div class="panel" id="menu">
  <h1>Lantern<br>Sprite</h1>
  <p class="sub">Endless Light &nbsp;·&nbsp; Run Forever</p>
  <button id="btnPlay">Begin Run</button>
  <div class="tips">
    <div class="tip"><b>↑ ↓ &nbsp;/&nbsp; W S</b>Fly up &amp; down</div>
    <div class="tip"><b>Space</b>Light burst</div>
    <div class="tip"><b style="color:#ffd77a">●</b>&nbsp;Gold · +Points &amp; Dawn</div>
    <div class="tip"><b style="color:#4fd6ff">●</b>&nbsp;Blue · Speed</div>
    <div class="tip"><b style="color:#7fff7f">●</b>&nbsp;Green · Shield</div>
    <div class="tip"><b style="color:#cf9fff">●</b>&nbsp;Purple · 2× Score</div>
    <div class="tip"><b style="color:#e8e8ff">●</b>&nbsp;White · Super Magnet</div>
  </div>
  <p id="menuHS" class="stat"></p>
</div>

<!-- GAME OVER -->
<div class="panel hide" id="end">
  <h2 id="endTitle"></h2>
  <p class="sub" id="endSub"></p>
  <p id="endScore" class="stat"></p>
  <button id="btnAgain">Run Again</button>
</div>

<div id="pubar"></div>
<button id="sb">Sound: on</button>

<script>
'use strict';
// ─── Canvas setup ─────────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
const C=$('c'),x=C.getContext('2d'),L=document.createElement('canvas'),lx=L.getContext('2d');
let W,H,D;
function resize(){
  D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  for(const cv of[C,L]){cv.width=W*D;cv.height=H*D}
  x.setTransform(D,0,0,D,0,0);lx.setTransform(D,0,0,D,0,0);
}
addEventListener('resize',resize);resize();

// ─── roundRect polyfill ───────────────────────────────────────────────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(rx,ry,rw,rh,rr){
    this.beginPath();this.moveTo(rx+rr,ry);this.lineTo(rx+rw-rr,ry);
    this.arcTo(rx+rw,ry,rx+rw,ry+rr,rr);this.lineTo(rx+rw,ry+rh-rr);
    this.arcTo(rx+rw,ry+rh,rx+rw-rr,ry+rh,rr);this.lineTo(rx+rr,ry+rh);
    this.arcTo(rx,ry+rh,rx,ry+rh-rr,rr);this.lineTo(rx,ry+rr);
    this.arcTo(rx,ry+rr,rx+rr,ry,rr);this.closePath();
  };
}

// ─── Math helpers ─────────────────────────────────────────────────────────────
const Rnd=(a,b)=>a+Math.random()*(b-a);
const rn=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const mix=(a,b,k)=>a+(b-a)*k;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const interpColor=(c0,c1,t)=>[mix(c0[0],c1[0],t),mix(c0[1],c1[1],t),mix(c0[2],c1[2],t)];
function mixColorStr(s0,s1,t){
  const p0=s0.split(',').map(Number),p1=s1.split(',').map(Number);
  return `${Math.round(mix(p0[0],p1[0],t))},${Math.round(mix(p0[1],p1[1],t))},${Math.round(mix(p0[2],p1[2],t))}`;
}

// ─── Biome catalogue with Night & Dawn Palettes ──────────────────────────────
const BIOMES=[
  // 1. Enchanted Forest
  {
    name:'Enchanted Forest',
    skyNight:[[235,60,8],  [250,55,14], [260,60,20]],
    skyDawn: [[265,60,22], [320,55,45], [18,60,62]],
    gNight:  [250,40,6],
    gDawn:   [140,42,18],
    treeNight:[250,240],
    treeDawn: [320,335],
    archH:[250,270], archL:[10,32],
    mush:[190,285,320,45],
    sunNight:['#e8f0ff','200,220,255'],
    sunDawn: ['#ffd9a0','255,190,120']
  },
  // 2. Crystal Caverns
  {
    name:'Crystal Caverns',
    skyNight:[[260,65,6],  [275,60,12], [285,65,18]],
    skyDawn: [[280,68,20], [330,62,44], [195,80,58]],
    gNight:  [270,35,5],
    gDawn:   [185,55,18],
    treeNight:[270,260],
    treeDawn: [315,195],
    archH:[270,280], archL:[8,28],
    mush:[200,240,260,180],
    sunNight:['#e0d8ff','190,170,255'],
    sunDawn: ['#9fe6ff','120,230,255']
  },
  // 3. Volcanic Wastes
  {
    name:'Volcanic Wastes',
    skyNight:[[10,70,7],   [20,65,13],  [30,70,18]],
    skyDawn: [[25,75,20],  [350,70,42], [42,90,62]],
    gNight:  [15,55,6],
    gDawn:   [30,65,17],
    treeNight:[15,10],
    treeDawn: [350,38],
    archH:[15,25], archL:[7,26],
    mush:[10,30,45,355],
    sunNight:['#ffb0aa','255,100,70'],
    sunDawn: ['#ffea88','255,190,60']
  },
  // 4. Frozen Tundra
  {
    name:'Frozen Tundra',
    skyNight:[[200,50,9],  [215,50,15], [225,50,22]],
    skyDawn: [[195,60,22], [280,50,42], [50,85,62]],
    gNight:  [210,45,7],
    gDawn:   [195,50,20],
    treeNight:[205,215],
    treeDawn: [275,175],
    archH:[210,220], archL:[9,28],
    mush:[200,210,220,185],
    sunNight:['#d8f4ff','180,225,255'],
    sunDawn: ['#fff4b8','255,230,140']
  },
  // 5. Celestial Realm
  {
    name:'Celestial Realm',
    skyNight:[[280,60,10], [300,58,16], [320,60,24]],
    skyDawn: [[295,70,25], [335,65,48], [48,90,66]],
    gNight:  [290,50,9],
    gDawn:   [280,55,22],
    treeNight:[285,300],
    treeDawn: [330,45],
    archH:[290,310], archL:[10,30],
    mush:[280,300,320,260],
    sunNight:['#e8dcff','210,180,255'],
    sunDawn: ['#ffe8a0','255,210,110']
  }
];

function getBiomes(){
  const i=Math.floor(biomePr)%BIOMES.length;
  const j=(i+1)%BIOMES.length;
  const bl=biomePr%1;
  return [BIOMES[i],BIOMES[j],bl];
}

// ─── Firefly types ─────────────────────────────────────────────────────────────
const FF_CAT={
  GOLD:  {col:'#ffd77a',glow:'255,200,80', r:4.5,pts:10,pw:null,     dur:0, lab:'',        barC:'#ffd77a'},
  BLUE:  {col:'#4fd6ff',glow:'80,210,255', r:5,  pts:15,pw:'speed',  dur:6, lab:'SPEED',   barC:'#4fd6ff'},
  GREEN: {col:'#7fff7f',glow:'100,255,100',r:5,  pts:20,pw:'shield', dur:7, lab:'SHIELD',  barC:'#7fff7f'},
  PURPLE:{col:'#cf9fff',glow:'180,100,255',r:5,  pts:20,pw:'multi',  dur:6, lab:'2\u00d7 SCORE',barC:'#cf9fff'},
  WHITE: {col:'#e8e8ff',glow:'200,220,255',r:6,  pts:20,pw:'magnet', dur:5, lab:'MAGNET',  barC:'#e0e0ff'},
};

// ─── Audio ────────────────────────────────────────────────────────────────────
let AC,master,bus,noiseB,muted=false,nextBar=0,musicBar=0;
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch{return}
  master=AC.createGain();master.gain.value=muted?0:.7;master.connect(AC.destination);
  bus=AC.createGain();bus.connect(master);
  const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter(),wet=AC.createGain();
  dl.delayTime.value=.44;fb.gain.value=.38;lp.type='lowpass';lp.frequency.value=2200;wet.gain.value=.38;
  bus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(master);
  noiseB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const nd=noiseB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  nextBar=AC.currentTime+.1;setInterval(schedMusic,240);
}
function osc(f,t0,dur,type,vol,att,dest){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+att);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(dest||bus);o.start(t0);o.stop(t0+dur+.05);
}
function nz(t0,dur,freq,vol){
  if(!noiseB)return;
  const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();
  s.buffer=noiseB;fl.type='lowpass';fl.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(fl);fl.connect(g);g.connect(bus);s.start(t0);s.stop(t0+dur);
}
const CHORDS=[[[45,57,60,64],[41,53,57,60],[48,55,60,64],[43,55,59,62]],[[48,60,64,67],[53,60,65,69],[55,62,67,71],[45,57,64,69]]];
const MELODY=[[69,72,74,76,79,81,84],[72,74,76,79,81,84,88]];
let biomePr=0,diffPr=0;
function schedMusic(){
  if(!AC||AC.state!=='running')return;
  while(nextBar<AC.currentTime+.8){
    const k=Math.floor(biomePr)%2,ch=CHORDS[k][musicBar%4],t0=nextBar;
    const pf=AC.createBiquadFilter();pf.type='lowpass';pf.frequency.value=480+diffPr*1400;pf.connect(bus);
    ch.forEach((m,i)=>{if(!i)osc(mf(m-12),t0,5,'sine',.12,.8);else{osc(mf(m),t0,5.5,'triangle',.04,1.4,pf);osc(mf(m)*1.004,t0,5.5,'sine',.03,1.4,pf)}});
    const nb=3+Math.round(diffPr*5);
    for(let i=0;i<nb;i++){
      const m=MELODY[k][Math.floor(Math.random()*7)];
      const bt=t0+Math.floor(Math.random()*8)*.5+(Math.random()<.28?.25:0);
      osc(mf(m),bt,2,'sine',.07,.01);osc(mf(m)*2,bt,.8,'sine',.02,.01);
    }
    nextBar+=4;musicBar++;
  }
}
function sfx(n){
  if(!AC||AC.state!=='running')return;
  const t0=AC.currentTime;
  if(n==='click')osc(660,t0,.15,'sine',.12,.005);
  else if(n==='get'){osc(mf(79),t0,.9,'sine',.16,.005);osc(mf(86),t0+.07,.8,'triangle',.07,.005)}
  else if(n==='bonus'){osc(mf(84),t0,.4,'sine',.2,.005);osc(mf(91),t0+.1,.6,'sine',.15,.005);osc(mf(96),t0+.2,1,'sine',.12,.005)}
  else if(n==='hit'){nz(t0,.35,500,.5);const o2=AC.createOscillator(),g2=AC.createGain();o2.type='sawtooth';o2.frequency.setValueAtTime(180,t0);o2.frequency.exponentialRampToValueAtTime(45,t0+.35);g2.gain.setValueAtTime(.2,t0);g2.gain.exponentialRampToValueAtTime(.0001,t0+.4);o2.connect(g2);g2.connect(bus);o2.start(t0);o2.stop(t0+.5)}
  else if(n==='burst'){const o2=AC.createOscillator(),g2=AC.createGain();o2.type='sine';o2.frequency.setValueAtTime(300,t0);o2.frequency.exponentialRampToValueAtTime(1400,t0+.5);g2.gain.setValueAtTime(.2,t0);g2.gain.exponentialRampToValueAtTime(.0001,t0+.7);o2.connect(g2);g2.connect(bus);o2.start(t0);o2.stop(t0+.8);nz(t0,.6,3000,.1)}
  else if(n==='over')[69,67,64,57].forEach((m,i)=>osc(mf(m),t0+i*.28,1.2,'triangle',.14,.02));
  else if(n==='biome')[72,76,79,84].forEach((m,i)=>osc(mf(m),t0+i*.09,.9,'sine',.09,.01));
}
function toggleSound(){muted=!muted;if(master)master.gain.value=muted?0:.7;$('sb').textContent='Sound: '+(muted?'off':'on');$('sb').blur();initAudio()}
$('sb').onclick=toggleSound;
addEventListener('pointerdown',initAudio,{once:true});
addEventListener('keydown',initAudio,{once:true});
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume()});

// ─── Game state ───────────────────────────────────────────────────────────────
let gameState='menu'; // 'menu' | 'play' | 'over'
let gTime=0,worldX=0,score=0,scoreDisp=0,got=0;
let highScore=+(localStorage.getItem('ls_er_hs')||0);
let speed=200,prevBiomeIdx=-1;
let p={x:0,y:0,vy:0};
let camY=0,camYv=0; // smooth vertical camera
let hp=3,inv=0,burstCd=0,burstAnim=0,en=1;
let powers={speed:0,shield:0,multi:0,magnet:0};
let F=[],P=[],TR=[];      // fireflies, particles, trail
let obstacles=[];          // active obstacles + formation enemies
let ffTimer=0,obsTimer=0;
let awakeTimer=0,awakeText='';

function resetGame(){
  gTime=0;worldX=0;score=0;scoreDisp=0;got=0;
  speed=200;biomePr=0;diffPr=0;prevBiomeIdx=-1;
  p={x:W*.18,y:H*.5,vy:0};camY=0;camYv=0;
  hp=3;inv=0;burstCd=0;burstAnim=0;en=1;
  powers={speed:0,shield:0,multi:0,magnet:0};
  F=[];P=[];TR=[];obstacles=[];
  ffTimer=0;obsTimer=0;
  awakeTimer=0;awakeText='';
  $('pubar').innerHTML='';
}

// ─── Input ────────────────────────────────────────────────────────────────────
const keys={};
let pointerY=null;
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  keys[k]=1;
  if(k===' '){doLightBurst();e.preventDefault()}
  if(k.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=0});
C.addEventListener('pointerdown',e=>{pointerY=e.clientY});
C.addEventListener('pointermove',e=>{if(pointerY!==null)pointerY=e.clientY});
for(const ev of['pointerup','pointercancel','pointerleave'])C.addEventListener(ev,()=>{pointerY=null});

// ─── Drawing helpers ──────────────────────────────────────────────────────────
function glow(ctx,px,py,r,col,a){
  const g=ctx.createRadialGradient(px,py,0,px,py,r);
  g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));
  ctx.fillStyle=g;ctx.fillRect(px-r,py-r,r*2,r*2);
}
function particle(px,py,n,col){
  for(let i=0;i<n;i++){
    const a=Rnd(0,6.283),s=Rnd(40,170);
    P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,l:Rnd(.45,1.1),col,gravity:90,size:2.8});
  }
}

// ─── Dynamic Environmental Light / Dawn Progress ─────────────────────────────
function getEnvLight(){
  if(gameState==='menu')return 0;
  const cyclePr=(got%20)/20;
  const master=Math.min(.2,got*.005);
  const boost=burstAnim*.5+(powers.multi>0?.12:0)+(powers.speed>0?.1:0);
  return clamp(cyclePr*.82+master+boost,0,1);
}

// ─── Lantern Light Radius (Grows with Fireflies, Energy & Bursts) ─────────────
const lr=()=>(85+Math.min(got%20,20)*6+Math.min(got,50)*1.8)*(.55+.45*en)*(powers.speed>0?1.25:1)*(1+burstAnim*.85);

// ─── Power-up bar UI ──────────────────────────────────────────────────────────
function updatePUBar(){
  const bar=$('pubar');bar.innerHTML='';
  for(const[k,v]of Object.entries(powers)){
    if(v<=0)continue;
    const cat=Object.values(FF_CAT).find(f=>f.pw===k);
    if(!cat)continue;
    const pct=(v/cat.dur*100).toFixed(0);
    bar.innerHTML+=`<div class="putag" style="border-color:${cat.barC}55"><span style="color:${cat.barC}">${cat.lab}</span><div class="pu-track"><div class="pu-fill" style="width:${pct}%;background:${cat.barC}"></div></div></div>`;
  }
}

// ─── Spawning ─────────────────────────────────────────────────────────────────
function pickFFType(){
  const bonusCh=clamp(diffPr*.4+.1,.1,.6);
  if(Math.random()<bonusCh){
    const b=Math.random();
    if(b<.25)return 'BLUE';if(b<.5)return 'GREEN';if(b<.75)return 'PURPLE';return 'WHITE';
  }
  return 'GOLD';
}

function spawnFirefly(){
  const fy=Rnd(H*.1,H*.85),fx=W+Rnd(20,100);
  F.push({x:fx,y:fy,by:fy,ph:Rnd(0,6.28),type:pickFFType(),dead:false});
}

function spawnObstacle(){
  const d=diffPr,r=Math.random();
  let type;
  if(d<.2)      type=r<.65?'wall':'spike';
  else if(d<.45)type=r<.4?'wall':r<.72?'spike':'formation';
  else if(d<.7) type=r<.28?'wall':r<.52?'spike':r<.76?'formation':'mwall';
  else          type=r<.22?'wall':r<.42?'spike':r<.62?'formation':'mwall';
  makeObstacle(type);
}

function makeObstacle(type){
  const gapH=clamp(165-diffPr*90,60,165);
  if(type==='wall'){
    const gapY=Rnd(H*.22,H*.72);
    obstacles.push({type,x:W+30,w:24,gapY,gapH,passed:false,dead:false});
  } else if(type==='mwall'){
    const gapY=Rnd(H*.3,H*.66);
    obstacles.push({type,x:W+30,w:24,gapH,gapY,gapYv:Rnd(50,100)*(Math.random()<.5?1:-1),passed:false,dead:false});
  } else if(type==='spike'){
    const fromTop=Math.random()<.5;
    const sH=Rnd(55,115)+diffPr*35;
    obstacles.push({type,x:W+40,w:28,fromTop,sH,hitH:sH*.78,passed:false,dead:false});
  } else if(type==='formation'){
    const pats=[
      [{dx:0,dy:0},{dx:90,dy:-55},{dx:90,dy:55}],
      [{dx:0,dy:-60},{dx:0,dy:0},{dx:0,dy:60}],
      [{dx:0,dy:0},{dx:110,dy:0},{dx:55,dy:-65}],
      [{dx:0,dy:-45},{dx:75,dy:0},{dx:150,dy:-45},{dx:75,dy:-90}],
    ];
    const pat=pats[Math.floor(Math.random()*pats.length)];
    const cy=Rnd(H*.2,H*.75);
    obstacles.push({type,x:W+40,cy,enemies:pat.map(e=>({dx:e.dx,dy:e.dy,ph:Rnd(0,6.28)})),passed:false,dead:false});
  }
}

// ─── Gameplay actions ─────────────────────────────────────────────────────────
function doLightBurst(){
  if(gameState!=='play'||burstCd>0)return;
  burstCd=4.5;burstAnim=1;en=Math.min(1,en+.2);sfx('burst');
  powers.shield=Math.max(powers.shield,1.0);
  for(const o of obstacles){
    if(o.type==='formation'&&!o.dead&&Math.hypot(o.x-p.x,(o.cy||H*.5)-p.y)<340){
      o.dead=true;particle(o.x,o.cy,16,'#ffd77a');
    }
  }
  updatePUBar();
}

function hitPlayer(){
  if(inv>0)return;
  if(powers.shield>0){powers.shield=0;inv=.4;updatePUBar();particle(p.x,p.y,10,'#7fff7f');return}
  hp--;inv=1.8;sfx('hit');particle(p.x,p.y,18,'#ff4d6d');
  if(hp<=0)doGameOver();
}

function collectFF(o){
  const cat=FF_CAT[o.type];if(!cat)return;
  const multi=powers.multi>0?2:1;
  score+=cat.pts*multi;got++;
  en=Math.min(1,en+.28); // replenish lantern energy like in v1!

  // Full Dawn Awakening Milestone
  if(got%20===0){
    awakeTimer=3.8;
    const[b0]=getBiomes();
    awakeText=`${b0.name.toUpperCase()} AWAKENS!`;
    score+=500;burstAnim=1.0;sfx('bonus');
    for(let i=0;i<35;i++){
      const a=Rnd(0,6.28),sp=Rnd(60,220);
      P.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:Rnd(.8,1.8),col:'#ffd77a',gravity:30,size:Rnd(2,4)});
    }
  } else if(cat.pw){
    powers[cat.pw]=cat.dur;updatePUBar();sfx('bonus');
  } else {
    sfx('get');
  }
  o.dead=true;particle(o.x,o.y,12,cat.col);
}

function doGameOver(){
  gameState='over';sfx('over');
  if(score>highScore){highScore=score;localStorage.setItem('ls_er_hs',highScore)}
  $('endTitle').textContent='Your Light Went Out';
  $('endSub').textContent=`Flew ${(worldX/1000).toFixed(2)} km \u00b7 ${got} fireflies gathered`;
  $('endScore').textContent=`Score ${Math.round(scoreDisp).toLocaleString()}  \u00b7  Best ${highScore.toLocaleString()}`;
  $('end').classList.remove('hide');
  $('pubar').innerHTML='';
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update(dt){
  gTime+=dt;

  // Particle physics
  for(const q of P){
    q.x+=q.vx*dt;q.y+=q.vy*dt;
    q.vy+=(q.gravity||90)*dt;
    q.l-=dt;
  }
  P=P.filter(q=>q.l>0);

  if(gameState==='menu'){p.x=W*.18;p.y=H*.5+Math.sin(gTime*1.5)*14;return}
  if(gameState!=='play')return;

  // ── Difficulty & Speed ramp ────────────────────────────────────────────────
  diffPr=clamp(worldX/38000,0,1);
  const spd=200*(1+diffPr*2.2)*(powers.speed>0?1.45:1);
  speed+=(spd-speed)*Math.min(1,dt*3);
  worldX+=speed*dt;

  // Biome: switch every 8000px
  biomePr=worldX/8000;
  const newBI=Math.floor(biomePr)%BIOMES.length;
  if(newBI!==prevBiomeIdx&&prevBiomeIdx!==-1)sfx('biome');
  prevBiomeIdx=newBI;

  // Score
  score+=speed*dt*.012;
  scoreDisp+=(score-scoreDisp)*Math.min(1,dt*4);

  // ── Timers ─────────────────────────────────────────────────────────────────
  inv=Math.max(0,inv-dt);
  burstCd=Math.max(0,burstCd-dt);
  burstAnim=Math.max(0,burstAnim-dt*2.5);
  en=Math.max(.12,en-dt*.022); // energy slowly dims if not collecting fireflies!
  if(awakeTimer>0)awakeTimer=Math.max(0,awakeTimer-dt);

  let puChanged=false;
  for(const k in powers)if(powers[k]>0){powers[k]=Math.max(0,powers[k]-dt);puChanged=true}
  if(puChanged)updatePUBar();

  // ── Player movement ────────────────────────────────────────────────────────
  let ay=0;
  if(keys.ArrowUp||keys.w)ay=-1;
  if(keys.ArrowDown||keys.s)ay=1;
  if(pointerY!==null){const dy=pointerY-p.y;if(Math.abs(dy)>12)ay=clamp(dy/65,-1,1)}
  p.vy+=ay*1350*dt;
  p.vy*=Math.pow(.009,dt);
  p.y=clamp(p.y+p.vy*dt,36,H-72);

  // ── Smooth vertical camera parallax ────────────────────────────────────────
  const camTarget=(p.y/H-.5)*.06*H;
  camYv+=(camTarget-camY)*7*dt;camYv*=Math.pow(.08,dt);camY+=camYv*dt;

  // ── Trail ──────────────────────────────────────────────────────────────────
  TR.push({x:p.x,y:p.y});if(TR.length>28)TR.shift();

  // ── Ambient drifting spores / motes in atmosphere ───────────────────────────
  if(Math.random()<.22){
    const[b0]=getBiomes();
    const hs=b0.mush;
    const hu=hs[Math.floor(Math.random()*hs.length)];
    P.push({
      x:W+Rnd(10,60),
      y:Rnd(H*.1,H-75),
      vx:-speed*Rnd(.7,1.2),
      vy:Rnd(-15,15),
      l:Rnd(1.4,3.2),
      col:`hsla(${hu},90%,75%,${Rnd(.35,.75)})`,
      gravity:0,
      size:Rnd(1.2,2.5)
    });
  }

  // ── Spawn fireflies ────────────────────────────────────────────────────────
  ffTimer-=dt;
  if(ffTimer<=0){
    const rate=Math.max(.5,1.5-diffPr*.8);
    ffTimer=rate+Rnd(0,rate*.4);
    const n=Math.random()<(diffPr*.25+.08)?2:1;
    for(let i=0;i<n;i++)spawnFirefly();
  }

  // ── Spawn obstacles ────────────────────────────────────────────────────────
  obsTimer-=dt;
  if(obsTimer<=0&&worldX>600){
    const rate=Math.max(.85,3.2-diffPr*2.3);
    obsTimer=rate+Rnd(0,.6);
    if(Math.random()<clamp(diffPr*.5+.18,.15,.9))spawnObstacle();
  }

  // ── Firefly update (Attracted to character's light!) ────────────────────────
  const playerRadius=lr();
  for(const o of F){
    o.x-=speed*dt*.72;
    o.y=o.by+Math.sin(gTime*1.9+o.ph)*22;
    const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy);
    if(powers.magnet>0&&d<240){
      o.x+=dx/d*240*dt;o.y+=dy/d*240*dt;o.by=o.y;
    } else if(d<playerRadius*.58){
      // Fireflies gently pulled into player's lantern light glow!
      o.x+=dx/d*135*dt;o.by+=dy/d*135*dt;o.y=o.by;
    }
    if(d<30)collectFF(o);
  }
  F=F.filter(o=>!o.dead&&o.x>-70);

  // ── Obstacle update ────────────────────────────────────────────────────────
  for(const o of obstacles){
    if(o.dead)continue;
    o.x-=speed*dt;
    if(o.type==='mwall'){
      o.gapY+=o.gapYv*dt;
      if(o.gapY<H*.12+o.gapH/2||o.gapY>H*.88-o.gapH/2)o.gapYv*=-1;
    }
    if(!o.passed){
      if(o.type==='wall'||o.type==='mwall'){
        if(o.x<=p.x&&o.x+o.w>=p.x){
          const inGap=p.y>=o.gapY-o.gapH/2&&p.y<=o.gapY+o.gapH/2;
          if(!inGap)hitPlayer();
          o.passed=true;
        }
      } else if(o.type==='spike'){
        if(Math.abs(o.x-p.x)<26){
          const gy2=H-60;
          const danger=o.fromTop?p.y<=o.hitH:p.y>=gy2-o.hitH;
          if(danger)hitPlayer();
          o.passed=true;
        }
      } else if(o.type==='formation'){
        for(const e of o.enemies){
          const ex=o.x+e.dx,ey=o.cy+e.dy+Math.sin(gTime*2.2+e.ph)*16;
          if(Math.hypot(ex-p.x,ey-p.y)<28){hitPlayer();break}
        }
        if(o.x+220<p.x)o.passed=true;
      }
    }
    if(o.x<-350)o.dead=true;
  }
  obstacles=obstacles.filter(o=>!o.dead);
}

// ─── Draw: Background (Transforms Night -> Glorious Dawn with Character Light) ─
function getSkyColor(b0,b1,bl,pr,stopIdx){
  const c0=interpColor(b0.skyNight[stopIdx],b0.skyDawn[stopIdx],pr);
  const c1=interpColor(b1.skyNight[stopIdx],b1.skyDawn[stopIdx],pr);
  const cf=interpColor(c0,c1,bl);
  return `hsl(${cf[0]}, ${cf[1]}%, ${cf[2]}%)`;
}

function drawBG(){
  const[b0,b1,bl]=getBiomes();
  const pr=getEnvLight();

  // 1. Sky Gradient: Transitions from dark night into glorious glowing dawn!
  const sg=x.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,getSkyColor(b0,b1,bl,pr,0));
  sg.addColorStop(.55,getSkyColor(b0,b1,bl,pr,1));
  sg.addColorStop(1,getSkyColor(b0,b1,bl,pr,2));
  x.fillStyle=sg;x.fillRect(0,0,W,H);

  // 2. Stars: Twinkle at night, dissolve as player brings dawn!
  for(let i=0;i<65;i++){
    const starAlpha=(.3+.7*rn(i+9))*(.55+.45*Math.sin(gTime*1.5+i))*(1-pr*.88);
    if(starAlpha>.02){
      x.globalAlpha=starAlpha;x.fillStyle='#fff';
      x.fillRect(rn(i)*W,rn(i+55)*H*.55,1.5,1.5);
    }
  }
  x.globalAlpha=1;

  // 3. Celestial Body: Cold Moon -> Radiant Golden Sun at Dawn
  const mx2=W*.83,my2=H*.14-camY*.4;
  const sunR=mix(24,38,pr);
  const sunGlowR=mix(90,150,pr);
  const glowCol=pr>.48?mixColorStr(b0.sunDawn[1],b1.sunDawn[1],bl):mixColorStr(b0.sunNight[1],b1.sunNight[1],bl);
  const bodyCol=pr>.48?(b0.sunDawn[0]):(b0.sunNight[0]);

  x.globalCompositeOperation='lighter';
  glow(x,mx2,my2,sunGlowR,`rgba(${glowCol},A)`,.35+pr*.35);
  x.globalCompositeOperation='source-over';
  x.fillStyle=bodyCol;x.beginPath();x.arc(mx2,my2,sunR,0,7);x.fill();

  // Sunbeams slanting through the canopy at dawn
  if(pr>.38){
    x.save();x.globalCompositeOperation='lighter';
    const beamAlpha=(pr-.38)*.14;
    for(let i=-2;i<=2;i++){
      x.fillStyle=`rgba(255, 235, 160, ${beamAlpha})`;
      x.beginPath();
      x.moveTo(mx2+i*36,my2);
      x.lineTo(mx2+i*150-260,H);
      x.lineTo(mx2+i*150-180,H);
      x.closePath();x.fill();
    }
    x.restore();
  }

  const gy=H-60-camY*.25;

  // 4. Parallax Tree Layers (Canopy light & saturation bloom with character light!)
  drawTreeLayer(.18,200,.65,b0,b1,bl,pr,gy,0);
  drawTreeLayer(.44,250,.52,b0,b1,bl,pr,gy+8,1);

  // 5. Ruined Arches with Glowing Runes that ignite when player is close!
  const aH0=mix(b0.archH[0],b0.archH[1],pr),aH1=mix(b1.archH[0],b1.archH[1],pr);
  const archH=mix(aH0,aH1,bl);
  const aL0=mix(b0.archL[0],b0.archL[1],pr),aL1=mix(b1.archL[0],b1.archL[1],pr);
  const archL=mix(aL0,aL1,bl);

  const aoff=worldX*.72,a0=Math.floor(aoff/940);
  x.strokeStyle=`hsl(${archH}, 30%, ${archL}%)`;x.lineWidth=14;

  for(let i=a0;i<a0+4;i++){
    const ax=i*940-aoff+rn(i)*290+270;
    x.beginPath();x.moveTo(ax-56,gy);x.lineTo(ax-56,gy-92);x.arc(ax,gy-92,56,Math.PI,0);x.lineTo(ax+56,gy);x.stroke();

    // Runic crystals on arch ignite when sprite flies nearby!
    const distArch=Math.abs(ax-p.x);
    const archLit=Math.max(0,1-distArch/230);
    if(archLit>.05||pr>.5||burstAnim>0){
      const runeAlpha=clamp(archLit*.85+pr*.45+burstAnim*.7,0,1);
      x.save();x.globalCompositeOperation='lighter';
      glow(x,ax,gy-148,26,'rgba(255,215,120,A)',runeAlpha);
      x.fillStyle=`rgba(255, 235, 140, ${runeAlpha})`;
      x.beginPath();x.arc(ax,gy-148,4.5+archLit*2.5,0,7);x.fill();
      x.fillStyle=`rgba(140, 230, 255, ${runeAlpha*.75})`;
      x.fillRect(ax-58,gy-60,4,10);x.fillRect(ax+54,gy-60,4,10);
      x.restore();
    }
  }

  // 6. Ground Strip (Night ink -> Dawn forest moss / golden terrain)
  const gCol0=interpColor(b0.gNight,b0.gDawn,pr);
  const gCol1=interpColor(b1.gNight,b1.gDawn,pr);
  const gCol=interpColor(gCol0,gCol1,bl);
  x.fillStyle=`hsl(${gCol[0]}, ${gCol[1]}%, ${gCol[2]}%)`;
  x.fillRect(0,gy,W,H-gy+4);

  // 7. Ground Light Reflection Cast by Player Sprite
  const heightAboveGround=gy-p.y;
  if(heightAboveGround>0&&heightAboveGround<240){
    const refl=1-heightAboveGround/240;
    x.save();x.globalCompositeOperation='lighter';
    const rw=(55+(1-refl)*35)*(powers.speed>0?1.35:1);
    const colStr=powers.shield>0?'rgba(100,255,100,A)':(powers.speed>0?'rgba(80,210,255,A)':'rgba(255,225,120,A)');
    glow(x,p.x,gy,rw,colStr,refl*.52);
    x.restore();
  }
}

function drawTreeLayer(par,gap,hh,b0,b1,bl,pr,base,layerIdx){
  const off=worldX*par,i0=Math.floor(off/gap);
  const tH0=mix(b0.treeNight[layerIdx],b0.treeDawn[layerIdx],pr);
  const tH1=mix(b1.treeNight[layerIdx],b1.treeDawn[layerIdx],pr);
  const tH=mix(tH0,tH1,bl);
  const li=mix(9,34,pr)*(layerIdx===0?.75:1.0);
  const sat=mix(36,66,pr);

  for(let i=i0;i<i0+Math.ceil(W/gap)+3;i++){
    const X=i*gap-off+rn(i*3+par*10)*gap*.5,h=H*hh*(.55+rn(i+par*7)*.65),w=gap*.14;
    x.fillStyle=`hsl(${tH}, 32%, ${li*.65}%)`;x.fillRect(X-w/2,base-h,w,h+4);
    x.fillStyle=`hsl(${tH}, ${sat}%, ${li}%)`;
    for(let k=0;k<5;k++){
      x.beginPath();
      x.arc(X+(rn(i*5+k)-.5)*gap*.82,base-h+(rn(i*9+k)-.28)*h*.26,gap*(.2+rn(i+k*2)*.16),0,7);
      x.fill();
    }
  }
}

// ─── Draw: Mushrooms (Blooms & Releases Spores when Player is Close!) ─────────
function drawMushrooms(){
  const[b0]=getBiomes();
  const gy=H-60-camY*.25;
  const off=worldX,i0=Math.floor(off/120);
  const hs=b0.mush;
  const pr=getEnvLight();

  for(let i=i0;i<i0+Math.ceil(W/120)+2;i++){
    const X=i*120-off+rn(i)*80,h=10+rn(i+4)*16,hu=hs[Math.floor(rn(i+8)*4)];
    const distToPlayer=Math.hypot(X-p.x,(gy-h)-p.y);
    const playerRadius=lr();
    const isLitByPlayer=distToPlayer<playerRadius*.9;
    const litAmount=isLitByPlayer?Math.max(0,1-distToPlayer/(playerRadius*.9)):0;

    const glowRad=(44+litAmount*28+burstAnim*24)*(1+pr*.2);
    const glowAlpha=.36+litAmount*.5+burstAnim*.4+pr*.18;

    x.globalCompositeOperation='lighter';
    glow(x,X,gy-h,glowRad,`hsla(${hu},95%,65%,A)`,glowAlpha);
    x.globalCompositeOperation='source-over';

    x.fillStyle=`hsl(${hu},30%,${mix(78,96,litAmount)}%)`;
    x.fillRect(X-2,gy-h,4,h+4);

    x.fillStyle=`hsl(${hu},${mix(85,100,litAmount)}%,${mix(60,76,litAmount)}%)`;
    x.beginPath();
    const capW=(9+h*.3)*(1+litAmount*.35);
    const capH=(6+h*.2)*(1+litAmount*.3);
    x.ellipse(X,gy-h,capW,capH,0,Math.PI,0);
    x.fill();

    // Spore puff when character lantern illuminates mushroom!
    if(isLitByPlayer&&Math.random()<.08){
      P.push({
        x:X+Rnd(-8,8),y:gy-h,
        vx:Rnd(-25,25)-speed*.25,
        vy:Rnd(-45,-95),
        l:Rnd(.5,1.1),
        col:`hsla(${hu},95%,75%,.9)`,
        gravity:-20,
        size:Rnd(1.5,2.8)
      });
    }
  }
}

// ─── Draw: Obstacles ──────────────────────────────────────────────────────────
function drawObstacles(){
  const[b0,b1,bl]=getBiomes();
  const pr=getEnvLight();
  const bH=mix(b0.gDawn[0],b1.gDawn[0],bl);
  const gy=H-60;

  for(const o of obstacles){
    if(o.dead)continue;

    if(o.type==='wall'||o.type==='mwall'){
      const gTop=o.gapY-o.gapH/2,gBot=o.gapY+o.gapH/2;
      x.fillStyle=`hsl(${bH},${mix(25,45,pr)}%,${mix(10,24,pr)}%)`;
      x.fillRect(o.x,0,o.w,gTop);
      x.fillRect(o.x,gBot,o.w,H-gBot);
      const rc=o.type==='mwall'?'160,80,255':'80,150,255';
      x.globalCompositeOperation='lighter';
      glow(x,o.x+o.w/2,gTop,24,`rgba(${rc},A)`,.65);
      glow(x,o.x+o.w/2,gBot,24,`rgba(${rc},A)`,.65);
      x.globalCompositeOperation='source-over';
      x.save();x.globalAlpha=.28+Math.sin(gTime*5)*.14;
      x.strokeStyle='rgba(255,220,80,.9)';x.lineWidth=2;
      const mx3=o.x-14,my3=o.gapY;
      x.beginPath();x.moveTo(mx3,my3-10);x.lineTo(mx3+10,my3);x.lineTo(mx3,my3+10);x.stroke();
      x.restore();
    }

    else if(o.type==='spike'){
      x.fillStyle=`hsl(${bH+18},${mix(30,55,pr)}%,${mix(12,28,pr)}%)`;
      if(o.fromTop){
        x.beginPath();x.moveTo(o.x-16,0);x.lineTo(o.x+16,0);x.lineTo(o.x,o.sH);x.closePath();x.fill();
        x.globalCompositeOperation='lighter';glow(x,o.x,o.sH,22,'rgba(210,80,255,A)',.65);x.globalCompositeOperation='source-over';
      } else {
        x.beginPath();x.moveTo(o.x-16,gy);x.lineTo(o.x+16,gy);x.lineTo(o.x,gy-o.sH);x.closePath();x.fill();
        x.globalCompositeOperation='lighter';glow(x,o.x,gy-o.sH,22,'rgba(210,80,255,A)',.65);x.globalCompositeOperation='source-over';
      }
    }

    else if(o.type==='formation'){
      for(const e of o.enemies){
        const ex=o.x+e.dx,ey=o.cy+e.dy+Math.sin(gTime*2.2+e.ph)*16;
        drawShadowling(ex,ey);
      }
    }
  }
}

function drawShadowling(sx,sy){
  x.save();x.translate(sx,sy);
  x.fillStyle='#0b0620';x.strokeStyle='rgba(170,70,255,.72)';x.lineWidth=1.5;x.beginPath();
  for(let k=0;k<14;k++){const a=k/14*6.283,r=k%2?19:30+Math.sin(gTime*6+k)*3;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
  x.closePath();x.fill();x.stroke();
  x.globalCompositeOperation='lighter';
  glow(x,-8,-3,18,'rgba(255,40,60,A)',.72);glow(x,7,-3,18,'rgba(255,40,60,A)',.72);
  x.globalCompositeOperation='source-over';
  x.fillStyle='#ff3a4a';x.beginPath();x.arc(-8,-3,4,0,7);x.fill();x.beginPath();x.arc(7,-3,4,0,7);x.fill();
  x.restore();
}

// ─── Draw: Fireflies ──────────────────────────────────────────────────────────
function drawFireflies(){
  for(const o of F){
    const cat=FF_CAT[o.type];if(!cat)continue;
    x.globalCompositeOperation='lighter';
    glow(x,o.x,o.y,34,`rgba(${cat.glow},A)`,.75);
    x.globalCompositeOperation='source-over';
    x.save();x.globalAlpha=.42;x.fillStyle='rgba(200,240,255,.75)';
    x.beginPath();x.ellipse(o.x-6,o.y-4+Math.sin(gTime*28+o.ph)*2,5,2.3,-.5,0,7);x.fill();
    x.beginPath();x.ellipse(o.x+6,o.y-4+Math.sin(gTime*28+o.ph+1.1)*2,5,2.3,.5,0,7);x.fill();
    x.restore();
    x.fillStyle=cat.col;x.beginPath();x.arc(o.x,o.y,cat.r,0,7);x.fill();
    if(o.type!=='GOLD'){
      x.save();x.font='bold 7.5px Cinzel,serif';x.textAlign='center';
      x.fillStyle='rgba(255,255,255,.68)';x.fillText(cat.lab.split(' ')[0].substring(0,3),o.x,o.y-cat.r-4);
      x.restore();
    }
  }
}

// ─── Draw: Player Sprite (Aura glows & scales with gathered light) ───────────
function drawSprite(px,py,sc){
  x.save();x.translate(px,py);x.scale(sc,sc);
  x.globalCompositeOperation='lighter';
  glow(x,0,0,95*(.7+.3*en),'rgba(120,220,255,A)',.55);
  if(powers.shield>0)glow(x,0,0,58,'rgba(100,255,100,A)',.68);
  if(powers.speed>0) glow(x,0,0,72,'rgba(80,180,255,A)',.35);
  x.globalCompositeOperation='source-over';

  x.fillStyle='rgba(190,240,255,.92)';
  x.beginPath();x.moveTo(-6,-14);x.quadraticCurveTo(-34,-46,-42,-8);x.quadraticCurveTo(-24,-14,-6,-8);x.fill();
  x.beginPath();x.moveTo(2,-16);x.quadraticCurveTo(-6,-48,-22,-36);x.quadraticCurveTo(-8,-26,2,-10);x.fill();

  const bg=x.createRadialGradient(0,-4,2,0,0,26);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#9fe6ff');
  x.fillStyle=bg;x.beginPath();x.ellipse(0,0,24,20,0,0,7);x.fill();

  x.fillStyle='#10204a';x.beginPath();x.arc(9,-3,4.4,0,7);x.fill();x.beginPath();x.arc(-3,-3,3.6,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(10.4,-4.6,1.5,0,7);x.fill();x.beginPath();x.arc(-2,-4.4,1.2,0,7);x.fill();
  x.fillStyle='rgba(255,140,190,.5)';x.beginPath();x.ellipse(14,5,4,2.6,0,0,7);x.fill();

  if(powers.speed>0){
    x.save();
    for(let i=0;i<5;i++){x.globalAlpha=Rnd(.12,.42);x.strokeStyle='#4fd6ff';x.lineWidth=1.5;x.beginPath();x.moveTo(Rnd(-12,4),Rnd(-11,11));x.lineTo(Rnd(-72,-28),Rnd(-8,8));x.stroke()}
    x.restore();
  }
  if(powers.shield>0){
    x.save();x.strokeStyle=`rgba(100,255,100,${.38+Math.sin(gTime*8)*.18})`;x.lineWidth=2.5;
    x.beginPath();x.arc(0,0,36,0,7);x.stroke();x.restore();
  }
  x.restore();
}

// ─── Draw: Heart icon ─────────────────────────────────────────────────────────
function heart(hx,hy,s,on){
  x.save();x.translate(hx,hy);x.scale(s/14,s/14);
  x.beginPath();x.moveTo(0,8);x.bezierCurveTo(-18,-4,-7,-16,0,-6);x.bezierCurveTo(7,-16,18,-4,0,8);
  x.fillStyle=on?'#ff4d6d':'rgba(255,255,255,.18)';
  if(on){x.shadowColor='#ff4d6d';x.shadowBlur=8}
  x.fill();x.restore();
}

// ─── Draw: HUD ────────────────────────────────────────────────────────────────
function drawHUD(){
  const pr=getEnvLight();

  // Responsive layout measurements
  const isMobile = W < 600;
  const isSmallMobile = W < 420;

  // Score display: if mobile, position cleanly without colliding
  x.save();x.shadowColor='rgba(255,210,80,.75)';x.shadowBlur=20;
  x.font=isSmallMobile?'bold 24px Cinzel,serif':(isMobile?'bold 28px Cinzel,serif':'bold 34px Cinzel,serif');
  x.textAlign='center';x.fillStyle='#ffd77a';
  const scoreY = isMobile ? 36 : 44;
  x.fillText(Math.round(scoreDisp).toLocaleString(), W/2, scoreY);
  x.restore();

  x.font=isMobile?'500 9.5px Cinzel,serif':'500 11px Cinzel,serif';
  x.textAlign='center';x.fillStyle='rgba(185,215,255,.6)';
  x.fillText((worldX/1000).toFixed(2)+' km', W/2, scoreY + (isMobile ? 13 : 16));

  // Biome name
  const[b0,,bl]=getBiomes();
  x.font='italic 9.5px Cinzel,serif';x.textAlign='center';
  x.fillStyle=`rgba(220,200,255,${.35+bl*.15})`;
  x.fillText(b0.name.toUpperCase(), W/2, scoreY + (isMobile ? 26 : 32));

  // ── Left: Hearts, Burst arc & Energy meter (Responsive) ──
  const heartScale = isMobile ? 12 : 16;
  const heartSpacing = isMobile ? 24 : 34;
  const heartStartX = isMobile ? 20 : 36;
  const heartY = isMobile ? 22 : 34;

  for(let i=0;i<3;i++){
    heart(heartStartX + i * heartSpacing, heartY, heartScale, i < hp);
  }

  // Burst arc & Energy slot bar
  const burstCenterX = heartStartX;
  const burstCenterY = isMobile ? 48 : 70;
  const burstRadius = isMobile ? 9 : 13;
  const bpct = 1 - Math.min(1, burstCd / 4.5);

  x.strokeStyle = bpct >= 1 ? 'rgba(255,200,80,.88)' : 'rgba(255,255,255,.22)';
  x.lineWidth = isMobile ? 2 : 2.5;
  x.beginPath();
  x.arc(burstCenterX, burstCenterY, burstRadius, -.5 * Math.PI, -.5 * Math.PI + bpct * Math.PI * 2);
  x.stroke();

  if(bpct < 1){
    x.font = isMobile ? '5.5px Cinzel,serif' : '7px Cinzel,serif';
    x.textAlign = 'center';
    x.fillStyle = 'rgba(200,200,200,.6)';
    x.fillText('BURST', burstCenterX, burstCenterY + (isMobile ? 2 : 3));
  }

  // Energy slots
  const slotW = isMobile ? 11 : 17;
  const slotH = isMobile ? 9 : 14;
  const slotGap = isMobile ? 13 : 20;
  const slotStartX = burstCenterX + burstRadius + (isMobile ? 8 : 12);
  const slotStartY = burstCenterY - slotH / 2;

  for(let i=0;i<5;i++){
    const v = Math.max(0, Math.min(1, en * 5 - i));
    x.fillStyle = 'rgba(255,255,255,.12)';
    x.fillRect(slotStartX + i * slotGap, slotStartY, slotW, slotH);
    x.fillStyle = i < 4 ? '#ffd77a' : '#9fe6ff';
    x.fillRect(slotStartX + i * slotGap, slotStartY, slotW * v, slotH);
  }

  // ── Right: Firefly HUD Card (Fully Responsive & Non-Overlapping) ──
  const hw = isSmallMobile ? 128 : (isMobile ? 148 : 200);
  const hh2 = isSmallMobile ? 48 : (isMobile ? 54 : 66);
  const hr = isMobile ? 12 : 16;
  const hx0 = W - hw - (isMobile ? 10 : 16);
  const hy = isMobile ? 10 : 14;
  
  // Outer subtle dark drop glow
  x.save();
  x.shadowColor='rgba(0,0,0,0.6)';x.shadowBlur=16;x.shadowOffsetY=4;
  x.beginPath();x.roundRect(hx0,hy,hw,hh2,hr);
  x.fillStyle='rgba(6,9,36,0.78)';x.fill();
  x.restore();

  // Glassmorphic panel with gradient border
  x.save();
  const borderG=x.createLinearGradient(hx0,hy,hx0+hw,hy+hh2);
  borderG.addColorStop(0,'rgba(255,225,140,0.7)');
  borderG.addColorStop(0.5,'rgba(140,210,255,0.4)');
  borderG.addColorStop(1,'rgba(255,180,90,0.65)');
  x.beginPath();x.roundRect(hx0,hy,hw,hh2,hr);
  x.strokeStyle=borderG;x.lineWidth=1.5;x.stroke();

  // Interior backdrop gradient
  const bgG=x.createLinearGradient(hx0,hy,hx0,hy+hh2);
  bgG.addColorStop(0,'rgba(18,24,65,0.85)');
  bgG.addColorStop(1,'rgba(5,7,28,0.92)');
  x.fillStyle=bgG;x.fill();
  x.restore();

  // Shimmer crest line at the top
  const shimG=x.createLinearGradient(hx0+hr,hy+1,hx0+hw-hr,hy+1);
  shimG.addColorStop(0,'rgba(255,240,160,0)');
  shimG.addColorStop(0.3,'rgba(255,245,190,0.8)');
  shimG.addColorStop(0.7,'rgba(160,230,255,0.75)');
  shimG.addColorStop(1,'rgba(255,240,160,0)');
  x.strokeStyle=shimG;x.lineWidth=1.5;x.beginPath();x.moveTo(hx0+hr,hy+1.5);x.lineTo(hx0+hw-hr,hy+1.5);x.stroke();

  // Glowing animated Firefly orb icon
  const iconPulse = Math.sin(gTime*3.5)*1.2;
  const iconX = hx0 + (isSmallMobile ? 15 : (isMobile ? 18 : 22));
  const iconY = hy + (isSmallMobile ? 16 : (isMobile ? 19 : 24));
  const iconGlowR = (isSmallMobile ? 14 : (isMobile ? 16 : 20)) + iconPulse;
  const iconCoreR = isSmallMobile ? 3.5 : (isMobile ? 4 : 4.5);

  x.save();x.globalCompositeOperation='lighter';
  glow(x, iconX, iconY, iconGlowR, 'rgba(255,220,90,A)', 0.95);
  x.restore();
  
  // Firefly golden core
  x.fillStyle='#fffce6';x.beginPath();x.arc(iconX, iconY, iconCoreR, 0, 7);x.fill();
  
  // Translucent wings flutter
  x.save();x.globalAlpha=0.65;x.fillStyle='rgba(195,245,255,0.9)';
  const wingFlap = Math.sin(gTime*24)*1.8;
  const wingW = isSmallMobile ? 4 : 5.2;
  const wingH = isSmallMobile ? 2 : 2.6;
  x.beginPath();x.ellipse(iconX - (isSmallMobile ? 4.5 : 6), iconY - 2.5 + wingFlap*0.4, wingW, wingH, -0.55+wingFlap*0.08, 0, 7);x.fill();
  x.beginPath();x.ellipse(iconX + (isSmallMobile ? 4.5 : 6), iconY - 2.5 - wingFlap*0.4, wingW, wingH, 0.55-wingFlap*0.08, 0, 7);x.fill();
  x.restore();

  // Section Label: "FIREFLIES"
  const textLeftX = iconX + (isSmallMobile ? 12 : (isMobile ? 14 : 17));
  x.font = isSmallMobile ? '600 7.5px Cinzel,serif' : (isMobile ? '600 8.5px Cinzel,serif' : '600 9.5px Cinzel,serif');
  x.textAlign = 'left';x.fillStyle = 'rgba(195,220,255,0.75)';
  x.letterSpacing = '0.06em';
  x.fillText('FIREFLIES', textLeftX, hy + (isSmallMobile ? 13 : (isMobile ? 15 : 16)));

  // Big stylized Firefly count
  x.save();
  const countColor = pr >= 0.9 ? '#aaffcc' : '#ffd77a';
  x.shadowColor = pr >= 0.9 ? 'rgba(120,255,180,0.85)' : 'rgba(255,210,80,0.8)';
  x.shadowBlur = isMobile ? 10 : 16;
  x.font = isSmallMobile ? 'bold 16px Cinzel,serif' : (isMobile ? 'bold 19px Cinzel,serif' : 'bold 24px Cinzel,serif');
  x.fillStyle = countColor;
  x.fillText(got.toLocaleString(), textLeftX, hy + (isSmallMobile ? 29 : (isMobile ? 34 : 39)));
  x.restore();

  // Multiplier badge
  if(powers.multi>0){
    x.save();
    x.font = isSmallMobile ? 'bold 8px Cinzel,serif' : 'bold 10px Cinzel,serif';
    x.fillStyle = '#cf9fff';
    x.shadowColor = '#cf9fff';x.shadowBlur = 8;
    const numW = x.measureText(got.toLocaleString()).width;
    x.fillText('2×', textLeftX + numW + 4, hy + (isSmallMobile ? 27 : (isMobile ? 31 : 36)));
    x.restore();
  }

  // Smooth Dawn Progress Fill Bar
  const dawnCyclePr=(got%20)/20;
  const bx = hx0 + (isSmallMobile ? 8 : (isMobile ? 10 : 12));
  const bh = isSmallMobile ? 4 : (isMobile ? 5 : 6);
  const by2 = hy + hh2 - (isSmallMobile ? 9 : (isMobile ? 11 : 14));
  const bw = hw - (isSmallMobile ? 16 : (isMobile ? 20 : 24));
  
  // Bar track background
  x.fillStyle='rgba(255,255,255,0.08)';
  x.beginPath();x.roundRect(bx,by2,bw,bh,3);x.fill();
  x.strokeStyle='rgba(255,255,255,0.06)';x.lineWidth=1;x.stroke();

  // Gradient progress fill
  if(dawnCyclePr>0){
    const pg=x.createLinearGradient(bx,by2,bx+bw,by2);
    pg.addColorStop(0,`hsl(${mix(45,150,dawnCyclePr)},100%,62%)`);
    pg.addColorStop(1,`hsl(${mix(55,290,dawnCyclePr)},100%,72%)`);
    x.fillStyle=pg;
    const curW=Math.max(bh,bw*dawnCyclePr);
    x.beginPath();x.roundRect(bx,by2,curW,bh,3);x.fill();

    // Sparkle head at current progress
    x.save();x.globalCompositeOperation='lighter';
    glow(x,bx+curW,by2+bh/2,11,'rgba(255,245,130,A)',0.9);
    x.restore();
  }

  // Subtle pip marks for 25%, 50%, 75%
  for(let m=1;m<=3;m++){
    const mx3=bx+bw*(m/4);
    x.fillStyle='rgba(255,255,255,0.18)';
    x.fillRect(mx3-0.5,by2,1,bh);
  }

  // Difficulty stars (bottom-right)
  const stars=Math.min(5,Math.ceil(diffPr*5));
  if(stars>0){
    x.font='13px serif';x.textAlign='right';x.fillStyle='rgba(255,200,80,.72)';
    x.fillText('\u2605'.repeat(stars),W-14,H-14);
  }

  // Active power-up badges
  const activePW=Object.entries(powers).filter(([,v])=>v>0);
  if(activePW.length){
    const pw_w=activePW.length*52,pw_x0=(W-pw_w)/2;
    for(let i=0;i<activePW.length;i++){
      const[k,v]=activePW[i];
      const cat=Object.values(FF_CAT).find(f=>f.pw===k);if(!cat)continue;
      x.fillStyle='rgba(5,7,36,.82)';x.strokeStyle=cat.barC+'88';x.lineWidth=1.2;
      x.beginPath();x.roundRect(pw_x0+i*52,H-54,46,36,8);x.fill();x.stroke();
      x.font='8.5px Cinzel,serif';x.textAlign='center';x.fillStyle=cat.barC;
      x.fillText(cat.lab.split(' ')[0].substring(0,3),pw_x0+i*52+23,H-41);
      x.fillStyle='rgba(255,255,255,.1)';x.fillRect(pw_x0+i*52+4,H-27,38,4);
      x.fillStyle=cat.barC;x.fillRect(pw_x0+i*52+4,H-27,38*(v/cat.dur),4);
    }
  }

  // Celebratory Dawn Awakening Toast (V1 return of Dawn celebration!)
  if(awakeTimer>0){
    const alpha=Math.min(1,awakeTimer);
    x.save();x.globalAlpha=alpha;
    x.shadowColor='rgba(255,220,100,0.85)';x.shadowBlur=24;
    x.font='bold 22px Cinzel,serif';x.textAlign='center';x.fillStyle='#fff4ba';
    x.fillText(awakeText,W/2,H*.22);
    x.font='500 12px Cinzel,serif';x.fillStyle='rgba(220,240,255,0.85)';
    x.fillText('+500 DAWN AWAKENING BONUS',W/2,H*.22+22);
    x.restore();
  }
}

// ─── Main draw loop ───────────────────────────────────────────────────────────
function draw(){
  x.clearRect(0,0,W,H);
  const pr=getEnvLight();

  // Background
  x.save();x.translate(0,-camY);
  drawBG();
  x.restore();

  // Light/Fog Darkness Mask via offscreen canvas (Clears as character gathers light!)
  lx.globalCompositeOperation='source-over';lx.clearRect(0,0,W,H);
  const darkness=gameState==='menu'?.55:Math.max(.18,.84-pr*.58-burstAnim*.5);
  lx.fillStyle=`rgba(2,3,18,${darkness})`;lx.fillRect(0,0,W,H);
  lx.globalCompositeOperation='destination-out';

  // Player's Lantern Glow Cuts Hole through Darkness Fog
  const r=gameState==='menu'?240:lr();
  const lg=lx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
  lg.addColorStop(0,'rgba(0,0,0,1)');
  lg.addColorStop(.55,'rgba(0,0,0,0.76)');
  lg.addColorStop(1,'rgba(0,0,0,0)');
  lx.fillStyle=lg;lx.fillRect(p.x-r,p.y-r,r*2,r*2);

  // Each Firefly Cuts Out Warm Light in Darkness
  for(const o of F){
    const cat=FF_CAT[o.type];
    if(cat)glow(lx,o.x,o.y,60,'rgba(0,0,0,A)',.9);
  }

  // Light Burst Vaporizes Darkness in Massive Expanding Shockwave
  if(burstAnim>0){
    const br=60+(1-burstAnim)*(Math.max(W,H)*.8);
    const bg2=lx.createRadialGradient(p.x,p.y,0,p.x,p.y,br);
    bg2.addColorStop(0,'rgba(0,0,0,1)');
    bg2.addColorStop(.7,`rgba(0,0,0,${burstAnim})`);
    bg2.addColorStop(1,'rgba(0,0,0,0)');
    lx.fillStyle=bg2;lx.fillRect(p.x-br,p.y-br,br*2,br*2);
  }

  x.drawImage(L,0,0,W,H);

  drawMushrooms();
  drawObstacles();
  drawFireflies();

  // Trail
  const psc=Math.min(1.6,1+got*.015);
  x.globalCompositeOperation='lighter';
  TR.forEach((q,i)=>{
    const k=i/TR.length;
    glow(x,q.x-8,q.y+6,26*k*psc,'rgba(110,210,255,A)',.47*k);
  });
  x.globalCompositeOperation='source-over';

  // Sprite (blinks when invincible)
  const blink=inv>0&&Math.floor(gTime*13)%2;
  if(!blink)drawSprite(p.x,p.y,psc);

  // Light burst ring
  if(burstAnim>0){
    x.strokeStyle=`rgba(255,225,140,${burstAnim})`;x.lineWidth=6*burstAnim;
    x.beginPath();x.arc(p.x,p.y,40+(1-burstAnim)*310,0,7);x.stroke();
  }

  // Particles & Floating Spores
  x.globalCompositeOperation='lighter';
  for(const q of P){
    x.globalAlpha=Math.max(0,q.l);
    x.fillStyle=q.col;
    x.beginPath();x.arc(q.x,q.y,q.size||2.8,0,7);x.fill();
  }
  x.globalAlpha=1;x.globalCompositeOperation='source-over';

  if(gameState==='play'||gameState==='over')drawHUD();
}

// ─── Game flow ────────────────────────────────────────────────────────────────
function startGame(){
  initAudio();sfx('click');resetGame();gameState='play';
  $('menu').classList.add('hide');$('end').classList.add('hide');
}
$('btnPlay').onclick=startGame;
$('btnAgain').onclick=startGame;
if(highScore>0)$('menuHS').textContent='Best: '+highScore.toLocaleString();

// ─── Loop ─────────────────────────────────────────────────────────────────────
let lastTs=0;
function loop(ts){
  const dt=Math.min(.05,(ts-lastTs)/1000||0);
  lastTs=ts;update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
