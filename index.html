<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Sprite – Endless Run</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Lobster+Two:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#ffd77a;--ink:#070a24}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;font-family:Cinzel,Georgia,serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;background:radial-gradient(ellipse at center,rgba(5,6,30,.5),rgba(5,6,30,.12));pointer-events:none}
.panel>*{pointer-events:auto}
.hide{display:none!important}
h1,h2{font-family:'Lobster Two',cursive;font-style:italic;font-weight:700;color:var(--gold);text-shadow:0 0 24px #ffb83a99,0 0 60px #4fd6ff66;margin:0;line-height:.95}
h1{font-size:clamp(52px,12vw,110px)}h2{font-size:clamp(40px,8vw,80px)}
.sub{margin:0;font-size:clamp(13px,2.2vw,17px);color:#cfe9ff;letter-spacing:.04em}
.stat{font-family:Cinzel,serif;font-size:clamp(14px,2.2vw,20px);color:#fff3b0;margin:2px 0}
button{font:600 19px Cinzel,serif;color:var(--gold);background:rgba(10,14,50,.72);border:2px solid var(--gold);border-radius:999px;padding:9px 38px;cursor:pointer;box-shadow:0 0 22px #ffb83a66,inset 0 0 14px #ffb83a33}
button:hover,button:focus-visible{background:rgba(40,36,90,.88);outline:none;box-shadow:0 0 34px #ffb83acc}
.tips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:580px}
.tip{background:rgba(10,12,40,.68);border:1px solid rgba(255,215,122,.3);border-radius:10px;padding:6px 13px;font-size:12px;color:#dbe8ff}
.tip b{display:block;font-size:13px;margin-bottom:1px}
#sb{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));font-size:13px;padding:7px 16px;border-color:#b9a6ff;color:#d9ceff;box-shadow:0 0 14px #8a6bff44}
#pubar{position:fixed;left:max(14px,env(safe-area-inset-left));top:92px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.putag{display:flex;align-items:center;gap:6px;background:rgba(5,7,34,.82);border-radius:8px;padding:4px 10px;font-size:10.5px;font-family:Cinzel,serif;border:1px solid rgba(255,255,255,.12)}
.pu-track{width:50px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin-left:4px}
.pu-fill{height:100%;border-radius:2px;transition:width .08s linear}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- MENU -->
<div class="panel" id="menu">
  <h1>Lantern<br>Sprite</h1>
  <p class="sub">Endless Light &nbsp;·&nbsp; Run Forever</p>
  <button id="btnPlay">Begin Run</button>
  <div class="tips">
    <div class="tip"><b>↑ ↓ &nbsp;/&nbsp; W S</b>Fly up &amp; down</div>
    <div class="tip"><b>Space</b>Light burst</div>
    <div class="tip"><b style="color:#ffd77a">●</b>&nbsp;Gold · +Points</div>
    <div class="tip"><b style="color:#4fd6ff">●</b>&nbsp;Blue · Speed</div>
    <div class="tip"><b style="color:#7fff7f">●</b>&nbsp;Green · Shield</div>
    <div class="tip"><b style="color:#cf9fff">●</b>&nbsp;Purple · 2× Score</div>
    <div class="tip"><b style="color:#e8e8ff">●</b>&nbsp;White · Magnet</div>
  </div>
  <p id="menuHS" class="stat"></p>
</div>

<!-- GAME OVER -->
<div class="panel hide" id="end">
  <h2 id="endTitle"></h2>
  <p class="sub" id="endSub"></p>
  <p id="endScore" class="stat"></p>
  <button id="btnAgain">Run Again</button>
</div>

<div id="pubar"></div>
<button id="sb">Sound: on</button>

<script>
'use strict';
// ─── Canvas setup ─────────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
const C=$('c'),x=C.getContext('2d'),L=document.createElement('canvas'),lx=L.getContext('2d');
let W,H,D;
function resize(){
  D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  for(const cv of[C,L]){cv.width=W*D;cv.height=H*D}
  x.setTransform(D,0,0,D,0,0);lx.setTransform(D,0,0,D,0,0);
}
addEventListener('resize',resize);resize();

// ─── roundRect polyfill ───────────────────────────────────────────────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(rx,ry,rw,rh,rr){
    this.beginPath();this.moveTo(rx+rr,ry);this.lineTo(rx+rw-rr,ry);
    this.arcTo(rx+rw,ry,rx+rw,ry+rr,rr);this.lineTo(rx+rw,ry+rh-rr);
    this.arcTo(rx+rw,ry+rh,rx+rw-rr,ry+rh,rr);this.lineTo(rx+rr,ry+rh);
    this.arcTo(rx,ry+rh,rx,ry+rh-rr,rr);this.lineTo(rx,ry+rr);
    this.arcTo(rx,ry,rx+rr,ry,rr);this.closePath();
  };
}

// ─── Math helpers ─────────────────────────────────────────────────────────────
const Rnd=(a,b)=>a+Math.random()*(b-a);
const rn=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const mix=(a,b,k)=>a+(b-a)*k;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

// ─── Biome catalogue ──────────────────────────────────────────────────────────
const BIOMES=[
  // Enchanted Forest
  {name:'Enchanted Forest',skyH:[235,250],skyL:[8,22],skyS:60,gH:250,gS:40,gL:6,tH:[250,320],mush:[190,285,320,45],  archH:250,archS:30,archL:10},
  // Crystal Caverns
  {name:'Crystal Caverns', skyH:[260,280],skyL:[6,20],skyS:65,gH:270,gS:35,gL:5,tH:[270,290],mush:[200,240,260,180], archH:270,archS:35,archL:8},
  // Volcanic Wastes
  {name:'Volcanic Wastes', skyH:[10,25],  skyL:[7,20],skyS:70,gH:15, gS:55,gL:6,tH:[15,35],  mush:[10,30,45,355],    archH:15, archS:50,archL:7},
  // Frozen Tundra
  {name:'Frozen Tundra',   skyH:[200,220],skyL:[10,26],skyS:50,gH:210,gS:45,gL:8,tH:[205,215],mush:[200,210,220,185],archH:210,archS:40,archL:9},
  // Celestial Realm
  {name:'Celestial Realm', skyH:[280,310],skyL:[11,28],skyS:60,gH:290,gS:50,gL:10,tH:[285,315],mush:[280,300,320,260],archH:290,archS:45,archL:11},
];
function lerBiome(key,b0,b1,bl){return typeof b0[key]==='number'?mix(b0[key],b1[key],bl):b0[key]}
function getBiomes(){
  const i=Math.floor(biomePr)%BIOMES.length,j=(i+1)%BIOMES.length,bl=biomePr%1;
  return [BIOMES[i],BIOMES[j],bl];
}

// ─── Firefly types ─────────────────────────────────────────────────────────────
const FF_CAT={
  GOLD:  {col:'#ffd77a',glow:'255,200,80', r:4.5,pts:10,pw:null,     dur:0, lab:'',        barC:'#ffd77a'},
  BLUE:  {col:'#4fd6ff',glow:'80,210,255', r:5,  pts:15,pw:'speed',  dur:6, lab:'SPEED',   barC:'#4fd6ff'},
  GREEN: {col:'#7fff7f',glow:'100,255,100',r:5,  pts:20,pw:'shield', dur:7, lab:'SHIELD',  barC:'#7fff7f'},
  PURPLE:{col:'#cf9fff',glow:'180,100,255',r:5,  pts:20,pw:'multi',  dur:6, lab:'2\u00d7 SCORE',barC:'#cf9fff'},
  WHITE: {col:'#e8e8ff',glow:'200,220,255',r:6,  pts:20,pw:'magnet', dur:5, lab:'MAGNET',  barC:'#e0e0ff'},
};

// ─── Audio ────────────────────────────────────────────────────────────────────
let AC,master,bus,noiseB,muted=false,nextBar=0,musicBar=0;
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch{return}
  master=AC.createGain();master.gain.value=muted?0:.7;master.connect(AC.destination);
  bus=AC.createGain();bus.connect(master);
  const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter(),wet=AC.createGain();
  dl.delayTime.value=.44;fb.gain.value=.38;lp.type='lowpass';lp.frequency.value=2200;wet.gain.value=.38;
  bus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(master);
  noiseB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const nd=noiseB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  nextBar=AC.currentTime+.1;setInterval(schedMusic,240);
}
function osc(f,t0,dur,type,vol,att,dest){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+att);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(dest||bus);o.start(t0);o.stop(t0+dur+.05);
}
function nz(t0,dur,freq,vol){
  if(!noiseB)return;
  const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();
  s.buffer=noiseB;fl.type='lowpass';fl.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(fl);fl.connect(g);g.connect(bus);s.start(t0);s.stop(t0+dur);
}
const CHORDS=[[[45,57,60,64],[41,53,57,60],[48,55,60,64],[43,55,59,62]],[[48,60,64,67],[53,60,65,69],[55,62,67,71],[45,57,64,69]]];
const MELODY=[[69,72,74,76,79,81,84],[72,74,76,79,81,84,88]];
let biomePr=0,diffPr=0; // used by music scheduler
function schedMusic(){
  if(!AC||AC.state!=='running')return;
  while(nextBar<AC.currentTime+.8){
    const k=Math.floor(biomePr)%2,ch=CHORDS[k][musicBar%4],t0=nextBar;
    const pf=AC.createBiquadFilter();pf.type='lowpass';pf.frequency.value=480+diffPr*1400;pf.connect(bus);
    ch.forEach((m,i)=>{if(!i)osc(mf(m-12),t0,5,'sine',.12,.8);else{osc(mf(m),t0,5.5,'triangle',.04,1.4,pf);osc(mf(m)*1.004,t0,5.5,'sine',.03,1.4,pf)}});
    const nb=3+Math.round(diffPr*5);
    for(let i=0;i<nb;i++){
      const m=MELODY[k][Math.floor(Math.random()*7)];
      const bt=t0+Math.floor(Math.random()*8)*.5+(Math.random()<.28?.25:0);
      osc(mf(m),bt,2,'sine',.07,.01);osc(mf(m)*2,bt,.8,'sine',.02,.01);
    }
    nextBar+=4;musicBar++;
  }
}
function sfx(n){
  if(!AC||AC.state!=='running')return;
  const t0=AC.currentTime;
  if(n==='click')osc(660,t0,.15,'sine',.12,.005);
  else if(n==='get'){osc(mf(79),t0,.9,'sine',.16,.005);osc(mf(86),t0+.07,.8,'triangle',.07,.005)}
  else if(n==='bonus'){osc(mf(84),t0,.4,'sine',.2,.005);osc(mf(91),t0+.1,.6,'sine',.15,.005);osc(mf(96),t0+.2,1,'sine',.12,.005)}
  else if(n==='hit'){nz(t0,.35,500,.5);const o2=AC.createOscillator(),g2=AC.createGain();o2.type='sawtooth';o2.frequency.setValueAtTime(180,t0);o2.frequency.exponentialRampToValueAtTime(45,t0+.35);g2.gain.setValueAtTime(.2,t0);g2.gain.exponentialRampToValueAtTime(.0001,t0+.4);o2.connect(g2);g2.connect(bus);o2.start(t0);o2.stop(t0+.5)}
  else if(n==='burst'){const o2=AC.createOscillator(),g2=AC.createGain();o2.type='sine';o2.frequency.setValueAtTime(300,t0);o2.frequency.exponentialRampToValueAtTime(1400,t0+.5);g2.gain.setValueAtTime(.2,t0);g2.gain.exponentialRampToValueAtTime(.0001,t0+.7);o2.connect(g2);g2.connect(bus);o2.start(t0);o2.stop(t0+.8);nz(t0,.6,3000,.1)}
  else if(n==='over')[69,67,64,57].forEach((m,i)=>osc(mf(m),t0+i*.28,1.2,'triangle',.14,.02));
  else if(n==='biome')[72,76,79,84].forEach((m,i)=>osc(mf(m),t0+i*.09,.9,'sine',.09,.01));
}
function toggleSound(){muted=!muted;if(master)master.gain.value=muted?0:.7;$('sb').textContent='Sound: '+(muted?'off':'on');$('sb').blur();initAudio()}
$('sb').onclick=toggleSound;
addEventListener('pointerdown',initAudio,{once:true});
addEventListener('keydown',initAudio,{once:true});
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume()});

// ─── Game state ───────────────────────────────────────────────────────────────
let gameState='menu'; // 'menu' | 'play' | 'over'
let gTime=0,worldX=0,score=0,scoreDisp=0,got=0;
let highScore=+(localStorage.getItem('ls_er_hs')||0);
let speed=200,prevBiomeIdx=-1;
let p={x:0,y:0,vy:0};
let camY=0,camYv=0; // smooth vertical camera
let hp=3,inv=0,burstCd=0,burstAnim=0,en=1;
let powers={speed:0,shield:0,multi:0,magnet:0};
let F=[],P=[],TR=[];      // fireflies, particles, trail
let obstacles=[];          // all active obstacles + formation enemies
let ffTimer=0,obsTimer=0;

function resetGame(){
  gTime=0;worldX=0;score=0;scoreDisp=0;got=0;
  speed=200;biomePr=0;diffPr=0;prevBiomeIdx=-1;
  p={x:W*.18,y:H*.5,vy:0};camY=0;camYv=0;
  hp=3;inv=0;burstCd=0;burstAnim=0;en=1;
  powers={speed:0,shield:0,multi:0,magnet:0};
  F=[];P=[];TR=[];obstacles=[];
  ffTimer=0;obsTimer=0;
  $('pubar').innerHTML='';
}

// ─── Input ────────────────────────────────────────────────────────────────────
const keys={};
let pointerY=null;
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  keys[k]=1;
  if(k===' '){doLightBurst();e.preventDefault()}
  if(k.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=0});
C.addEventListener('pointerdown',e=>{pointerY=e.clientY});
C.addEventListener('pointermove',e=>{if(pointerY!==null)pointerY=e.clientY});
for(const ev of['pointerup','pointercancel','pointerleave'])C.addEventListener(ev,()=>{pointerY=null});

// ─── Drawing helpers ──────────────────────────────────────────────────────────
function glow(ctx,px,py,r,col,a){
  const g=ctx.createRadialGradient(px,py,0,px,py,r);
  g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));
  ctx.fillStyle=g;ctx.fillRect(px-r,py-r,r*2,r*2);
}
function particle(px,py,n,col){
  for(let i=0;i<n;i++){
    const a=Rnd(0,6.283),s=Rnd(40,170);
    P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,l:Rnd(.45,1.1),col});
  }
}

// ─── Power-up bar UI ──────────────────────────────────────────────────────────
function updatePUBar(){
  const bar=$('pubar');bar.innerHTML='';
  for(const[k,v]of Object.entries(powers)){
    if(v<=0)continue;
    const cat=Object.values(FF_CAT).find(f=>f.pw===k);
    if(!cat)continue;
    const pct=(v/cat.dur*100).toFixed(0);
    bar.innerHTML+=`<div class="putag" style="border-color:${cat.barC}55"><span style="color:${cat.barC}">${cat.lab}</span><div class="pu-track"><div class="pu-fill" style="width:${pct}%;background:${cat.barC}"></div></div></div>`;
  }
}

// ─── Spawning ─────────────────────────────────────────────────────────────────
function pickFFType(){
  const bonusCh=clamp(diffPr*.4+.1,.1,.6);
  if(Math.random()<bonusCh){
    const b=Math.random();
    if(b<.25)return 'BLUE';if(b<.5)return 'GREEN';if(b<.75)return 'PURPLE';return 'WHITE';
  }
  return 'GOLD';
}

function spawnFirefly(){
  const fy=Rnd(H*.1,H*.85),fx=W+Rnd(20,100);
  F.push({x:fx,y:fy,by:fy,ph:Rnd(0,6.28),type:pickFFType(),dead:false});
}

function spawnObstacle(){
  const d=diffPr,r=Math.random();
  let type;
  if(d<.2)      type=r<.65?'wall':'spike';
  else if(d<.45)type=r<.4?'wall':r<.72?'spike':'formation';
  else if(d<.7) type=r<.28?'wall':r<.52?'spike':r<.76?'formation':'mwall';
  else          type=r<.22?'wall':r<.42?'spike':r<.62?'formation':'mwall';
  makeObstacle(type);
}

function makeObstacle(type){
  const gy=H-60;
  const gapH=clamp(165-diffPr*90,60,165);
  if(type==='wall'){
    const gapY=Rnd(H*.22,H*.72);
    obstacles.push({type,x:W+30,w:24,gapY,gapH,passed:false,dead:false});
  } else if(type==='mwall'){
    // gap oscillates vertically
    const gapY=Rnd(H*.3,H*.66);
    obstacles.push({type,x:W+30,w:24,gapH,gapY,gapYv:Rnd(50,100)*(Math.random()<.5?1:-1),passed:false,dead:false});
  } else if(type==='spike'){
    const fromTop=Math.random()<.5;
    const sH=Rnd(55,115)+diffPr*35;
    obstacles.push({type,x:W+40,w:28,fromTop,sH,hitH:sH*.78,passed:false,dead:false});
  } else if(type==='formation'){
    // group of mini-shadowlings in a pattern
    const pats=[
      [{dx:0,dy:0},{dx:90,dy:-55},{dx:90,dy:55}],           // V shape
      [{dx:0,dy:-60},{dx:0,dy:0},{dx:0,dy:60}],             // vertical line
      [{dx:0,dy:0},{dx:110,dy:0},{dx:55,dy:-65}],           // triangle
      [{dx:0,dy:-45},{dx:75,dy:0},{dx:150,dy:-45},{dx:75,dy:-90}], // diamond
    ];
    const pat=pats[Math.floor(Math.random()*pats.length)];
    const cy=Rnd(H*.2,H*.75);
    obstacles.push({type,x:W+40,cy,enemies:pat.map(e=>({dx:e.dx,dy:e.dy,ph:Rnd(0,6.28)})),passed:false,dead:false});
  }
}

// ─── Gameplay actions ─────────────────────────────────────────────────────────
function doLightBurst(){
  if(gameState!=='play'||burstCd>0)return;
  burstCd=4.5;burstAnim=1;sfx('burst');
  powers.shield=Math.max(powers.shield,1.0);
  // Destroy nearby formation obstacles
  for(const o of obstacles){
    if(o.type==='formation'&&!o.dead&&Math.hypot(o.x-p.x,(o.cy||H*.5)-p.y)<320){
      o.dead=true;particle(o.x,o.cy,14,'#ffd77a');
    }
  }
  updatePUBar();
}

function hitPlayer(){
  if(inv>0)return;
  if(powers.shield>0){powers.shield=0;inv=.4;updatePUBar();particle(p.x,p.y,10,'#7fff7f');return}
  hp--;inv=1.8;sfx('hit');particle(p.x,p.y,18,'#ff4d6d');
  if(hp<=0)doGameOver();
}

function collectFF(o){
  const cat=FF_CAT[o.type];if(!cat)return;
  const multi=powers.multi>0?2:1;
  score+=cat.pts*multi;got++;
  if(cat.pw){powers[cat.pw]=cat.dur;updatePUBar();sfx('bonus')}else sfx('get');
  o.dead=true;particle(o.x,o.y,10,cat.col);
}

function doGameOver(){
  gameState='over';sfx('over');
  if(score>highScore){highScore=score;localStorage.setItem('ls_er_hs',highScore)}
  $('endTitle').textContent='Your Light Went Out';
  $('endSub').textContent=`Flew ${(worldX/1000).toFixed(2)} km \u00b7 ${got} fireflies`;
  $('endScore').textContent=`Score ${Math.round(scoreDisp).toLocaleString()}  \u00b7  Best ${highScore.toLocaleString()}`;
  $('end').classList.remove('hide');
  $('pubar').innerHTML='';
}

// ─── Update ───────────────────────────────────────────────────────────────────
function update(dt){
  gTime+=dt;

  // Particles always update
  for(const q of P){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=90*dt;q.l-=dt}
  P=P.filter(q=>q.l>0);

  if(gameState==='menu'){p.x=W*.18;p.y=H*.5+Math.sin(gTime*1.5)*14;return}
  if(gameState!=='play')return;

  // ── Difficulty ramp ────────────────────────────────────────────────────────
  diffPr=clamp(worldX/38000,0,1);
  const spd=200*(1+diffPr*2.2)*(powers.speed>0?1.45:1);
  speed+=(spd-speed)*Math.min(1,dt*3); // smooth speed transitions
  worldX+=speed*dt;

  // Biome: switch every 8000px
  biomePr=worldX/8000;
  const newBI=Math.floor(biomePr)%BIOMES.length;
  if(newBI!==prevBiomeIdx&&prevBiomeIdx!==-1)sfx('biome');
  prevBiomeIdx=newBI;

  // Score: distance + firefly points
  score+=speed*dt*.012;
  scoreDisp+=(score-scoreDisp)*Math.min(1,dt*4);

  // ── Timers ─────────────────────────────────────────────────────────────────
  inv=Math.max(0,inv-dt);
  burstCd=Math.max(0,burstCd-dt);
  burstAnim=Math.max(0,burstAnim-dt*2.5);
  en=Math.min(1,en+dt*.005);
  let puChanged=false;
  for(const k in powers)if(powers[k]>0){powers[k]=Math.max(0,powers[k]-dt);puChanged=true}
  if(puChanged)updatePUBar();

  // ── Player movement ────────────────────────────────────────────────────────
  let ay=0;
  if(keys.ArrowUp||keys.w)ay=-1;
  if(keys.ArrowDown||keys.s)ay=1;
  if(pointerY!==null){const dy=pointerY-p.y;if(Math.abs(dy)>12)ay=clamp(dy/65,-1,1)}
  p.vy+=ay*1350*dt;
  p.vy*=Math.pow(.009,dt); // strong damping for responsive feel
  p.y=clamp(p.y+p.vy*dt,36,H-72);

  // ── Smooth vertical camera (parallax feel) ─────────────────────────────────
  const camTarget=(p.y/H-.5)*.06*H;
  camYv+=(camTarget-camY)*7*dt;camYv*=Math.pow(.08,dt);camY+=camYv*dt;

  // ── Trail ──────────────────────────────────────────────────────────────────
  TR.push({x:p.x,y:p.y});if(TR.length>28)TR.shift();

  // ── Spawn fireflies ────────────────────────────────────────────────────────
  ffTimer-=dt;
  if(ffTimer<=0){
    const rate=Math.max(.5,1.5-diffPr*.8);
    ffTimer=rate+Rnd(0,rate*.4);
    const n=Math.random()<(diffPr*.25+.08)?2:1;
    for(let i=0;i<n;i++)spawnFirefly();
  }

  // ── Spawn obstacles ────────────────────────────────────────────────────────
  obsTimer-=dt;
  if(obsTimer<=0&&worldX>600){
    const rate=Math.max(.85,3.2-diffPr*2.3);
    obsTimer=rate+Rnd(0,.6);
    if(Math.random()<clamp(diffPr*.5+.18,.15,.9))spawnObstacle();
  }

  // ── Firefly update ─────────────────────────────────────────────────────────
  const magnetR=powers.magnet>0?200:0;
  for(const o of F){
    o.x-=speed*dt*.72;
    o.y=o.by+Math.sin(gTime*1.9+o.ph)*22;
    const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy);
    if(magnetR>0&&d<magnetR&&d>1){o.x+=dx/d*220*dt;o.y+=dy/d*220*dt;o.by=o.y}
    if(d<30)collectFF(o);
  }
  F=F.filter(o=>!o.dead&&o.x>-70);

  // ── Obstacle update ────────────────────────────────────────────────────────
  for(const o of obstacles){
    if(o.dead)continue;
    o.x-=speed*dt;

    // Moving wall gap oscillation
    if(o.type==='mwall'){
      o.gapY+=o.gapYv*dt;
      if(o.gapY<H*.12+o.gapH/2||o.gapY>H*.88-o.gapH/2)o.gapYv*=-1;
    }

    // Collision – trigger once when obstacle crosses player x
    if(!o.passed){
      if(o.type==='wall'||o.type==='mwall'){
        if(o.x<=p.x&&o.x+o.w>=p.x){
          const inGap=p.y>=o.gapY-o.gapH/2&&p.y<=o.gapY+o.gapH/2;
          if(!inGap)hitPlayer();
          o.passed=true;
        }
      } else if(o.type==='spike'){
        if(Math.abs(o.x-p.x)<26){
          const gy2=H-60;
          const danger=o.fromTop?p.y<=o.hitH:p.y>=gy2-o.hitH;
          if(danger)hitPlayer();
          o.passed=true;
        }
      } else if(o.type==='formation'){
        for(const e of o.enemies){
          const ex=o.x+e.dx,ey=o.cy+e.dy+Math.sin(gTime*2.2+e.ph)*16;
          if(Math.hypot(ex-p.x,ey-p.y)<28){hitPlayer();break}
        }
        if(o.x+220<p.x)o.passed=true;
      }
    }

    if(o.x<-350)o.dead=true;
  }
  obstacles=obstacles.filter(o=>!o.dead);
}

// ─── Draw: background ─────────────────────────────────────────────────────────
function drawBG(){
  const[b0,b1,bl]=getBiomes();
  const sh0=mix(b0.skyH[0],b1.skyH[0],bl),sh1=mix(b0.skyH[1],b1.skyH[1],bl);
  const sl0=mix(b0.skyL[0],b1.skyL[0],bl),sl1=mix(b0.skyL[1],b1.skyL[1],bl);
  const ss=mix(b0.skyS,b1.skyS,bl);
  const sg=x.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,`hsl(${sh0},${ss}%,${sl0}%)`);
  sg.addColorStop(.55,`hsl(${mix(sh0,sh1,.55)},${ss}%,${mix(sl0,sl1,.55)}%)`);
  sg.addColorStop(1,`hsl(${sh1},${ss}%,${sl1}%)`);
  x.fillStyle=sg;x.fillRect(0,0,W,H);

  // Stars (fade with bright biomes)
  const starAlpha=Math.max(0,1-sl0*.06);
  for(let i=0;i<65;i++){
    x.globalAlpha=starAlpha*(.3+.7*rn(i+9))*(.55+.45*Math.sin(gTime*1.5+i));
    x.fillStyle='#fff';x.fillRect(rn(i)*W,rn(i+55)*H*.55,1.5,1.5);
  }
  x.globalAlpha=1;

  // Moon/sun (shifts with cam)
  const mx2=W*.83,my2=H*.14-camY*.4;
  x.globalCompositeOperation='lighter';
  glow(x,mx2,my2,110,'rgba(200,220,255,A)',.38);
  x.globalCompositeOperation='source-over';
  x.fillStyle='#e8f0ff';x.beginPath();x.arc(mx2,my2,26,0,7);x.fill();

  const gy=H-60-camY*.25;
  drawTreeLayer(.18,200,.65,b0,b1,bl,gy);
  drawTreeLayer(.44,250,.52,b0,b1,bl,gy+8);

  // Ruined arches – biome-tinted
  const aH=mix(b0.archH,b1.archH,bl),aS=mix(b0.archS,b1.archS,bl),aL=mix(b0.archL,b1.archL,bl);
  const aoff=worldX*.72,a0=Math.floor(aoff/940);
  x.strokeStyle=`hsl(${aH},${aS}%,${aL*1.9}%)`;x.lineWidth=14;
  for(let i=a0;i<a0+4;i++){
    const ax=i*940-aoff+rn(i)*290+270;
    x.beginPath();x.moveTo(ax-56,gy);x.lineTo(ax-56,gy-92);x.arc(ax,gy-92,56,Math.PI,0);x.lineTo(ax+56,gy);x.stroke();
  }

  // Ground strip
  const gH2=mix(b0.gH,b1.gH,bl),gS2=mix(b0.gS,b1.gS,bl),gL2=mix(b0.gL,b1.gL,bl);
  x.fillStyle=`hsl(${gH2},${gS2}%,${gL2}%)`;x.fillRect(0,gy,W,H-gy+4);
}

function drawTreeLayer(par,gap,hh,b0,b1,bl,base){
  const off=worldX*par,i0=Math.floor(off/gap);
  const li=mix(mix(b0.skyL[0],b0.skyL[1],.5),mix(b1.skyL[0],b1.skyL[1],.5),bl)*.85;
  const tH=mix(b0.tH[0],b1.tH[0],bl),tH2=mix(b0.tH[1],b1.tH[1],bl);
  for(let i=i0;i<i0+Math.ceil(W/gap)+3;i++){
    const X=i*gap-off+rn(i*3+par*10)*gap*.5,h=H*hh*(.55+rn(i+par*7)*.65),w=gap*.14;
    x.fillStyle=`hsl(${tH},34%,${li*.65}%)`;x.fillRect(X-w/2,base-h,w,h+4);
    x.fillStyle=`hsl(${tH2},40%,${li}%)`;
    for(let k=0;k<5;k++){x.beginPath();x.arc(X+(rn(i*5+k)-.5)*gap*.82,base-h+(rn(i*9+k)-.28)*h*.26,gap*(.2+rn(i+k*2)*.16),0,7);x.fill()}
  }
}

function drawMushrooms(){
  const[b0,,bl]=getBiomes();
  const gy=H-60-camY*.25;
  const off=worldX,i0=Math.floor(off/120);
  const hs=b0.mush;
  for(let i=i0;i<i0+Math.ceil(W/120)+2;i++){
    const X=i*120-off+rn(i)*80,h=10+rn(i+4)*16,hu=hs[Math.floor(rn(i+8)*4)];
    x.globalCompositeOperation='lighter';glow(x,X,gy-h,44,`hsla(${hu},90%,60%,A)`,.38);x.globalCompositeOperation='source-over';
    x.fillStyle=`hsl(${hu},30%,80%)`;x.fillRect(X-2,gy-h,4,h+4);
    x.fillStyle=`hsl(${hu},85%,62%)`;x.beginPath();x.ellipse(X,gy-h,9+h*.3,6+h*.2,0,Math.PI,0);x.fill();
  }
}

// ─── Draw: obstacles ──────────────────────────────────────────────────────────
function drawObstacles(){
  const[b0,b1,bl]=getBiomes();
  const bH=mix(b0.gH,b1.gH,bl),bS=mix(b0.gS,b1.gS,bl),bL=mix(b0.gL,b1.gL,bl);
  const gy=H-60;

  for(const o of obstacles){
    if(o.dead)continue;

    if(o.type==='wall'||o.type==='mwall'){
      const gTop=o.gapY-o.gapH/2,gBot=o.gapY+o.gapH/2;
      x.fillStyle=`hsl(${bH},${bS+14}%,${bL+5}%)`;
      x.fillRect(o.x,0,o.w,gTop);
      x.fillRect(o.x,gBot,o.w,H-gBot);
      // Glowing gap edges
      const rc=o.type==='mwall'?'160,80,255':'80,150,255';
      x.globalCompositeOperation='lighter';
      glow(x,o.x+o.w/2,gTop,24,`rgba(${rc},A)`,.65);
      glow(x,o.x+o.w/2,gBot,24,`rgba(${rc},A)`,.65);
      x.globalCompositeOperation='source-over';
      // Animated gap hint arrow
      x.save();x.globalAlpha=.28+Math.sin(gTime*5)*.14;
      x.strokeStyle='rgba(255,220,80,.9)';x.lineWidth=2;
      const mx3=o.x-14,my3=o.gapY;
      x.beginPath();x.moveTo(mx3,my3-10);x.lineTo(mx3+10,my3);x.lineTo(mx3,my3+10);x.stroke();
      x.restore();
    }

    else if(o.type==='spike'){
      x.fillStyle=`hsl(${bH+18},${bS+20}%,${bL+7}%)`;
      if(o.fromTop){
        x.beginPath();x.moveTo(o.x-16,0);x.lineTo(o.x+16,0);x.lineTo(o.x,o.sH);x.closePath();x.fill();
        x.globalCompositeOperation='lighter';glow(x,o.x,o.sH,22,'rgba(210,80,255,A)',.65);x.globalCompositeOperation='source-over';
      } else {
        x.beginPath();x.moveTo(o.x-16,gy);x.lineTo(o.x+16,gy);x.lineTo(o.x,gy-o.sH);x.closePath();x.fill();
        x.globalCompositeOperation='lighter';glow(x,o.x,gy-o.sH,22,'rgba(210,80,255,A)',.65);x.globalCompositeOperation='source-over';
      }
    }

    else if(o.type==='formation'){
      for(const e of o.enemies){
        const ex=o.x+e.dx,ey=o.cy+e.dy+Math.sin(gTime*2.2+e.ph)*16;
        drawShadowling(ex,ey);
      }
    }
  }
}

function drawShadowling(sx,sy){
  x.save();x.translate(sx,sy);
  x.fillStyle='#0b0620';x.strokeStyle='rgba(170,70,255,.72)';x.lineWidth=1.5;x.beginPath();
  for(let k=0;k<14;k++){const a=k/14*6.283,r=k%2?19:30+Math.sin(gTime*6+k)*3;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
  x.closePath();x.fill();x.stroke();
  x.globalCompositeOperation='lighter';
  glow(x,-8,-3,18,'rgba(255,40,60,A)',.72);glow(x,7,-3,18,'rgba(255,40,60,A)',.72);
  x.globalCompositeOperation='source-over';
  x.fillStyle='#ff3a4a';x.beginPath();x.arc(-8,-3,4,0,7);x.fill();x.beginPath();x.arc(7,-3,4,0,7);x.fill();
  x.restore();
}

// ─── Draw: fireflies ──────────────────────────────────────────────────────────
function drawFireflies(){
  for(const o of F){
    const cat=FF_CAT[o.type];if(!cat)continue;
    // Glow
    x.globalCompositeOperation='lighter';
    glow(x,o.x,o.y,34,`rgba(${cat.glow},A)`,.72);
    x.globalCompositeOperation='source-over';
    // Wings
    x.save();x.globalAlpha=.42;x.fillStyle='rgba(200,240,255,.75)';
    x.beginPath();x.ellipse(o.x-6,o.y-4+Math.sin(gTime*28+o.ph)*2,5,2.3,-.5,0,7);x.fill();
    x.beginPath();x.ellipse(o.x+6,o.y-4+Math.sin(gTime*28+o.ph+1.1)*2,5,2.3,.5,0,7);x.fill();
    x.restore();
    // Body
    x.fillStyle=cat.col;x.beginPath();x.arc(o.x,o.y,cat.r,0,7);x.fill();
    // Bonus label tag
    if(o.type!=='GOLD'){
      x.save();x.font='bold 7.5px Cinzel,serif';x.textAlign='center';
      x.fillStyle='rgba(255,255,255,.68)';x.fillText(cat.lab.split(' ')[0].substring(0,3),o.x,o.y-cat.r-4);
      x.restore();
    }
  }
}

// ─── Draw: player sprite ──────────────────────────────────────────────────────
function drawSprite(px,py,sc){
  x.save();x.translate(px,py);x.scale(sc,sc);
  // Outer light aura
  x.globalCompositeOperation='lighter';
  glow(x,0,0,95,'rgba(120,220,255,A)',.5);
  if(powers.shield>0)glow(x,0,0,58,'rgba(100,255,100,A)',.68);
  if(powers.speed>0) glow(x,0,0,72,'rgba(80,180,255,A)',.32);
  x.globalCompositeOperation='source-over';
  // Wings
  x.fillStyle='rgba(190,240,255,.92)';
  x.beginPath();x.moveTo(-6,-14);x.quadraticCurveTo(-34,-46,-42,-8);x.quadraticCurveTo(-24,-14,-6,-8);x.fill();
  x.beginPath();x.moveTo(2,-16);x.quadraticCurveTo(-6,-48,-22,-36);x.quadraticCurveTo(-8,-26,2,-10);x.fill();
  // Body
  const bg=x.createRadialGradient(0,-4,2,0,0,26);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#9fe6ff');
  x.fillStyle=bg;x.beginPath();x.ellipse(0,0,24,20,0,0,7);x.fill();
  // Eyes
  x.fillStyle='#10204a';x.beginPath();x.arc(9,-3,4.4,0,7);x.fill();x.beginPath();x.arc(-3,-3,3.6,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(10.4,-4.6,1.5,0,7);x.fill();x.beginPath();x.arc(-2,-4.4,1.2,0,7);x.fill();
  x.fillStyle='rgba(255,140,190,.5)';x.beginPath();x.ellipse(14,5,4,2.6,0,0,7);x.fill();
  // Speed streaks
  if(powers.speed>0){
    x.save();
    for(let i=0;i<5;i++){x.globalAlpha=Rnd(.12,.42);x.strokeStyle='#4fd6ff';x.lineWidth=1.5;x.beginPath();x.moveTo(Rnd(-12,4),Rnd(-11,11));x.lineTo(Rnd(-72,-28),Rnd(-8,8));x.stroke()}
    x.restore();
  }
  // Shield ring
  if(powers.shield>0){
    x.save();x.strokeStyle=`rgba(100,255,100,${.38+Math.sin(gTime*8)*.18})`;x.lineWidth=2.5;
    x.beginPath();x.arc(0,0,36,0,7);x.stroke();x.restore();
  }
  x.restore();
}

// ─── Draw: heart icon ─────────────────────────────────────────────────────────
function heart(hx,hy,s,on){
  x.save();x.translate(hx,hy);x.scale(s/14,s/14);
  x.beginPath();x.moveTo(0,8);x.bezierCurveTo(-18,-4,-7,-16,0,-6);x.bezierCurveTo(7,-16,18,-4,0,8);
  x.fillStyle=on?'#ff4d6d':'rgba(255,255,255,.18)';
  if(on){x.shadowColor='#ff4d6d';x.shadowBlur=8}
  x.fill();x.restore();
}

// ─── Draw: HUD ────────────────────────────────────────────────────────────────
function drawHUD(){
  // ── Score top-center ────────────────────────────────────────────────────────
  x.save();x.shadowColor='rgba(255,210,80,.75)';x.shadowBlur=20;
  x.font='bold 34px Cinzel,serif';x.textAlign='center';x.fillStyle='#ffd77a';
  x.fillText(Math.round(scoreDisp).toLocaleString(),W/2,44);
  x.restore();
  x.font='500 11px Cinzel,serif';x.textAlign='center';x.fillStyle='rgba(185,215,255,.6)';
  x.fillText((worldX/1000).toFixed(2)+' km',W/2,60);

  // Biome name (gentle fade on transition)
  const[b0,,bl]=getBiomes();
  x.font='italic 10.5px Cinzel,serif';x.textAlign='center';
  x.fillStyle=`rgba(220,200,255,${.25+bl*.15})`;
  x.fillText(b0.name.toUpperCase(),W/2,76);

  // ── Left: hearts + burst arc + energy ──────────────────────────────────────
  for(let i=0;i<3;i++)heart(36+i*34,34,16,i<hp);
  // Burst recharge arc
  const bpct=1-Math.min(1,burstCd/4.5);
  x.strokeStyle=bpct>=1?'rgba(255,200,80,.88)':'rgba(255,255,255,.22)';x.lineWidth=2.5;
  x.beginPath();x.arc(36,70,13,-.5*Math.PI,-.5*Math.PI+bpct*Math.PI*2);x.stroke();
  if(bpct<1){x.font='7px Cinzel,serif';x.textAlign='center';x.fillStyle='rgba(200,200,200,.5)';x.fillText('BURST',36,73)}
  // Energy slots
  for(let i=0;i<5;i++){
    const v=Math.max(0,Math.min(1,en*5-i));
    x.fillStyle='rgba(255,255,255,.12)';x.fillRect(58+i*20,63,17,14);
    x.fillStyle=i<4?'#ffd77a':'#9fe6ff';x.fillRect(58+i*20,63,17*v,14);
  }

  // ── Right: firefly HUD panel ────────────────────────────────────────────────
  const hw=212,hh2=72,hr=14,hx0=W-hw-14,hy=12;
  x.save();x.shadowColor='rgba(255,185,50,.6)';x.shadowBlur=24;
  x.beginPath();x.roundRect(hx0,hy,hw,hh2,hr);
  x.fillStyle='rgba(5,7,36,.84)';x.fill();
  x.strokeStyle='rgba(255,215,122,.52)';x.lineWidth=1.5;x.stroke();
  x.restore();
  const shimG=x.createLinearGradient(hx0,hy,hx0+hw,hy);
  shimG.addColorStop(0,'rgba(255,220,100,0)');shimG.addColorStop(.5,'rgba(255,220,100,.62)');shimG.addColorStop(1,'rgba(255,220,100,0)');
  x.strokeStyle=shimG;x.lineWidth=1;x.beginPath();x.moveTo(hx0+hr,hy+1);x.lineTo(hx0+hw-hr,hy+1);x.stroke();
  // Firefly icon
  x.save();x.globalCompositeOperation='lighter';glow(x,hx0+20,hy+22,20,'rgba(255,220,80,A)',.95);x.restore();
  x.fillStyle='#fffbe0';x.beginPath();x.arc(hx0+20,hy+22,4.5,0,7);x.fill();
  x.save();x.globalAlpha=.48;x.fillStyle='rgba(180,240,255,.85)';
  x.beginPath();x.ellipse(hx0+14,hy+19,5,2.5,-.6,0,7);x.fill();
  x.beginPath();x.ellipse(hx0+27,hy+19,5,2.5,.6,0,7);x.fill();
  x.restore();
  // Label + count
  x.font='500 9.5px Cinzel,serif';x.textAlign='left';x.fillStyle='rgba(190,215,255,.7)';x.fillText('FIREFLIES',hx0+36,hy+15);
  x.save();x.shadowColor='#ffd060';x.shadowBlur=14;
  x.font='bold 26px Cinzel,serif';x.fillStyle='#ffd77a';x.fillText(got+'',hx0+36,hy+42);x.restore();
  const gw=x.measureText(got+'').width;
  x.fillStyle='rgba(255,255,255,.28)';x.font='bold 17px Cinzel,serif';x.fillText('\u00d7',hx0+44+gw,hy+40);
  // Biome progress bar
  const bpr=(worldX%8000)/8000;
  const bx=hx0+10,by2=hy+hh2-15,bw=hw-20,bh=8;
  x.fillStyle='rgba(255,255,255,.09)';x.beginPath();x.roundRect(bx,by2,bw,bh,4);x.fill();
  if(bpr>0){
    const pg=x.createLinearGradient(bx,by2,bx+bw,by2);
    pg.addColorStop(0,`hsl(${mix(48,160,diffPr)},100%,60%)`);
    pg.addColorStop(1,`hsl(${mix(55,280,diffPr)},100%,72%)`);
    x.fillStyle=pg;x.beginPath();x.roundRect(bx,by2,Math.max(bh,bw*bpr),bh,4);x.fill();
    x.save();x.globalCompositeOperation='lighter';glow(x,bx+bw*bpr,by2+bh/2,13,'rgba(255,235,100,A)',.85);x.restore();
  }
  for(let m=1;m<=3;m++){const mx3=bx+bw*(m/4);x.fillStyle='rgba(255,255,255,.2)';x.fillRect(mx3-.5,by2,1,bh)}

  // ── Difficulty stars (bottom-right) ─────────────────────────────────────────
  const stars=Math.min(5,Math.ceil(diffPr*5));
  if(stars>0){
    x.font='13px serif';x.textAlign='right';x.fillStyle='rgba(255,200,80,.72)';
    x.fillText('\u2605'.repeat(stars),W-14,H-14);
  }

  // ── Active power-up bottom-center badges ────────────────────────────────────
  const activePW=Object.entries(powers).filter(([,v])=>v>0);
  if(activePW.length){
    const pw_w=activePW.length*52,pw_x0=(W-pw_w)/2;
    for(let i=0;i<activePW.length;i++){
      const[k,v]=activePW[i];
      const cat=Object.values(FF_CAT).find(f=>f.pw===k);if(!cat)continue;
      x.fillStyle='rgba(5,7,36,.82)';x.strokeStyle=cat.barC+'88';x.lineWidth=1.2;
      x.beginPath();x.roundRect(pw_x0+i*52,H-54,46,36,8);x.fill();x.stroke();
      x.font='8.5px Cinzel,serif';x.textAlign='center';x.fillStyle=cat.barC;
      x.fillText(cat.lab.split(' ')[0].substring(0,3),pw_x0+i*52+23,H-41);
      x.fillStyle='rgba(255,255,255,.1)';x.fillRect(pw_x0+i*52+4,H-27,38,4);
      x.fillStyle=cat.barC;x.fillRect(pw_x0+i*52+4,H-27,38*(v/cat.dur),4);
    }
  }
}

// ─── Main draw loop ───────────────────────────────────────────────────────────
function draw(){
  x.clearRect(0,0,W,H);

  // Background (with subtle vertical camera parallax)
  x.save();x.translate(0,-camY);
  drawBG();
  x.restore();

  // Light/fog mask via offscreen canvas
  lx.globalCompositeOperation='source-over';lx.clearRect(0,0,W,H);
  const darkness=gameState==='menu'?.55:Math.max(.35,.82-got*.004);
  lx.fillStyle=`rgba(2,3,18,${darkness})`;lx.fillRect(0,0,W,H);
  lx.globalCompositeOperation='destination-out';
  const lr=80+Math.min(got,45)*3.8;
  const lg=lx.createRadialGradient(p.x,p.y,0,p.x,p.y,lr);
  lg.addColorStop(0,'rgba(0,0,0,1)');lg.addColorStop(.55,'rgba(0,0,0,.76)');lg.addColorStop(1,'rgba(0,0,0,0)');
  lx.fillStyle=lg;lx.fillRect(p.x-lr,p.y-lr,lr*2,lr*2);
  for(const o of F){const cat=FF_CAT[o.type];if(cat)glow(lx,o.x,o.y,56,'rgba(0,0,0,A)',.87)}
  x.drawImage(L,0,0,W,H);

  drawMushrooms();
  drawObstacles();
  drawFireflies();

  // Trail
  const psc=Math.min(1.55,1+got*.01);
  x.globalCompositeOperation='lighter';
  TR.forEach((q,i)=>{const k=i/TR.length;glow(x,q.x-8,q.y+6,26*k*psc,'rgba(110,210,255,A)',.47*k)});
  x.globalCompositeOperation='source-over';

  // Sprite (blink when invincible)
  const blink=inv>0&&Math.floor(gTime*13)%2;
  if(!blink)drawSprite(p.x,p.y,psc);

  // Light burst ring
  if(burstAnim>0){
    x.strokeStyle=`rgba(255,225,140,${burstAnim})`;x.lineWidth=6*burstAnim;
    x.beginPath();x.arc(p.x,p.y,40+(1-burstAnim)*310,0,7);x.stroke();
  }

  // Particles
  x.globalCompositeOperation='lighter';
  for(const q of P){x.globalAlpha=Math.max(0,q.l);x.fillStyle=q.col;x.beginPath();x.arc(q.x,q.y,2.8,0,7);x.fill()}
  x.globalAlpha=1;x.globalCompositeOperation='source-over';

  if(gameState==='play'||gameState==='over')drawHUD();
}

// ─── Game flow ────────────────────────────────────────────────────────────────
function startGame(){
  initAudio();sfx('click');resetGame();gameState='play';
  $('menu').classList.add('hide');$('end').classList.add('hide');
}
$('btnPlay').onclick=startGame;
$('btnAgain').onclick=startGame;
if(highScore>0)$('menuHS').textContent='Best: '+highScore.toLocaleString();

// ─── Loop ─────────────────────────────────────────────────────────────────────
let lastTs=0;
function loop(ts){
  const dt=Math.min(.05,(ts-lastTs)/1000||0);
  lastTs=ts;update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
